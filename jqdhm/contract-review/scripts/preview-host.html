<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合同助手 · 本地演示</title>
<style>body{margin:0;font:13px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:#f4f7f8}header{padding:12px 20px;background:#fff6df;border-bottom:1px solid #e6d8b7;display:flex;align-items:center;gap:16px;flex-wrap:wrap}p{margin:0;flex:1;color:#6a501e}strong{display:block}button{background:white;border:1px solid #cdb77f;border-radius:6px;padding:8px 14px;cursor:pointer}button:disabled{opacity:.5}iframe{width:100%;height:calc(100vh - 85px);border:0;display:block}#feedback{padding:0 20px;color:#9b392b}</style></head><body>
<header><p><strong>本地合同整理演示 · Java 服务与插件工作台</strong><span id="mode">正在检查本地提取配置…</span></p><button id="fixture">载入测试草稿（不调用 AI）</button></header>
<div id="feedback" role="status"></div><iframe id="workbench" title="合同核对工作台" src="/workbench"></iframe>
<script>
const frame=document.getElementById('workbench'),instanceId=crypto.randomUUID(),channel='xpertai.remote_component';
const capabilities=fetch('/api/capabilities').then(async response=>{
  if(!response.ok)throw new Error('无法读取本地提取配置，请刷新重试。');
  const value=await response.json(),local=value.localExtraction;
  if(!local||typeof local.enabled!=='boolean'||typeof local.model!=='string')throw new Error('本地提取配置格式不正确。');
  document.getElementById('mode').textContent=local.enabled?'正文交给本地 Ollama（'+local.model+'）实际提取，之后由你核对确认。当前未安装到 Xpert。':'此页面模拟 Xpert 工作台通信，模型提取未启用。可载入固定测试草稿验证核对流程。';
  return value;
}).catch(error=>{document.getElementById('mode').textContent=error.message;return null;});
function post(type,body={}){frame.contentWindow.postMessage({channel,protocolVersion:1,instanceId,type,...body},location.origin);}
async function call(path,payload){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const value=await response.json();if(!response.ok)throw new Error(value.message||'本地服务请求失败');return value;}
window.addEventListener('message',async event=>{
  if(event.source!==frame.contentWindow||event.origin!==location.origin)return;
  const msg=event.data;if(!msg||msg.channel!==channel||msg.protocolVersion!==1)return;
  if(msg.type==='ready'){const config=await capabilities;if(config)post('init',{locale:'zh-Hans',initialQuery:{},localExtraction:config.localExtraction});return;}
  if(msg.instanceId!==instanceId)return;
  try{
    if(msg.type==='requestData'){post('data',{requestId:msg.requestId,data:await call('/api/view',{query:msg.query})});}
    else if(msg.type==='executeAction'){post('actionResult',{requestId:msg.requestId,result:await call('/api/action',{actionKey:msg.actionKey,input:msg.input})});}
    else if(msg.type==='invokeClientCommand'){post('error',{requestId:msg.requestId,message:'本地提取未启用。请使用 npm run demo 启动，或先载入顶部的固定测试草稿。'});}
  }catch(error){post('error',{requestId:msg.requestId,message:error.message});}
});
document.getElementById('fixture').addEventListener('click',async()=>{
  const button=document.getElementById('fixture');button.disabled=true;
  try{await call('/api/fixture',{});document.getElementById('feedback').textContent='已通过 Java API 保存测试草稿。请在工作台列表中选择查看。';post('hostEvent',{payload:{event:'assistant.tool.completed'}});}
  catch(error){document.getElementById('feedback').textContent=error.message;}
  finally{button.disabled=false;}
});
</script></body></html>

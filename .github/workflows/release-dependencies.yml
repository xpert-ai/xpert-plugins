name: Release Dependencies

on:
  pull_request:
  merge_group:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Frozen dependencies (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [xpertai, community]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.workspace }}/package.json
      - name: Test dependency guard
        run: node --test scripts/check-release-dependencies.test.mjs
      - name: Validate committed dependency inputs
        run: node scripts/check-release-dependencies.mjs --workspace ${{ matrix.workspace }}
      - name: Install locked dependencies
        run: pnpm -C ${{ matrix.workspace }} install --frozen-lockfile
      - name: Test Changesets publish lifecycles
        if: matrix.workspace == 'xpertai'
        run: node --test xpertai/scripts/changesets-publish-error.test.mjs
      - name: Test release versioning
        if: matrix.workspace == 'xpertai'
        run: node --test xpertai/scripts/artifact-tool-release.test.mjs
      - name: Verify database plugins against the published SDK
        if: matrix.workspace == 'xpertai'
        run: |
          pnpm -C xpertai run verify:database-workbench
          pnpm -C plugin-dev-harness --ignore-workspace install --frozen-lockfile --ignore-scripts
          pnpm -C plugin-dev-harness --ignore-workspace run build
          for plugin in db-studio mysql postgres hana; do
            node plugin-dev-harness/dist/index.js --workspace ./xpertai --plugin "@xpert-ai/plugin-$plugin"
          done
      - name: Build and verify Maps from a clean checkout
        if: matrix.workspace == 'xpertai'
        run: |
          pnpm -C xpertai exec nx build @xpert-ai/plugin-maps
          pnpm -C xpertai exec nx run-many -t test,typecheck,verify:dist -p @xpert-ai/plugin-maps --parallel=1
      - name: Build content and review plugins against published SDKs
        if: matrix.workspace == 'xpertai'
        run: >-
          pnpm -C xpertai exec nx run-many -t build
          -p @xpert-ai/plugin-spaces,@xpert-ai/plugin-markdown-editor,@xpert-ai/plugin-office-editor,@xpert-ai/plugin-code-review,@xpert-ai/plugin-lark-cli
          --parallel=1
      - name: Test content and review plugins
        if: matrix.workspace == 'xpertai'
        run: >-
          pnpm -C xpertai exec nx run-many -t test
          -p @xpert-ai/plugin-spaces,@xpert-ai/plugin-markdown-editor,@xpert-ai/plugin-office-editor,@xpert-ai/plugin-code-review,@xpert-ai/plugin-lark-cli
          --parallel=1
      - name: Build community plugins
        if: matrix.workspace == 'community'
        run: pnpm -C community run build
      - name: Test community Project role synchronization
        if: matrix.workspace == 'community'
        run: pnpm -C community --filter @xpert-ai/plugin-factory-operations --filter @xpert-ai/plugin-material-identity-governance test

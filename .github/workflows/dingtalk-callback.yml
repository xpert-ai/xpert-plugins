name: DingTalk callback regression

on:
  pull_request:
    paths:
      - 'xpertai/integrations/dingtalk/**'
      - 'xpertai/package.json'
      - 'xpertai/pnpm-lock.yaml'
      - '.github/workflows/dingtalk-callback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  callback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DINGTALK_TEST_REDIS_URL: redis://127.0.0.1:6379
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: xpertai/package.json
      - name: Install locked dependencies
        working-directory: xpertai
        run: corepack pnpm install --frozen-lockfile
      - name: Test across independent processes and build
        working-directory: xpertai
        run: |
          corepack pnpm exec nx test @xpert-ai/plugin-dingtalk --runInBand --skipNxCache
          corepack pnpm exec nx build @xpert-ai/plugin-dingtalk --skipSync
      - name: Prepare lifecycle harness
        working-directory: plugin-dev-harness
        run: |
          corepack pnpm --ignore-workspace install --frozen-lockfile --ignore-scripts
          corepack pnpm --ignore-workspace run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Load plugin on the production Node version
        run: node plugin-dev-harness/dist/index.js --workspace ./xpertai --plugin @xpert-ai/plugin-dingtalk

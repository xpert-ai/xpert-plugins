    - kind: agent-middleware-tool
      provider: SandboxFile
      name: sandbox_write_file
      required: true
    - kind: agent-middleware-tool
      provider: SandboxFile
      name: sandbox_read_file
      required: true
    - kind: agent-middleware-tool
      provider: SandboxFile
      name: sandbox_edit_file
      required: true

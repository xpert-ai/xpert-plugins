# https://cloud.tencent.com/tokenhub/hy4 (current promotional rates)
model: hy4
label:
  en_US: hy4
  zh_Hans: hy4
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - structured-output
model_properties:
  mode: chat
  context_size: 1048576
  max_output: 65536
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    type: int
    min: 1
    max: 65536
    default: 4096
pricing:
  input: '3.0'
  output: '9.0'
  currency: RMB
  unit: '0.000001'
  rules:
    - component: input
      unit_price: 3.0
      unit_size: 1000000
    - component: output
      unit_price: 9.0
      unit_size: 1000000
    - component: cache_read_input
      unit_price: 0.15
      unit_size: 1000000

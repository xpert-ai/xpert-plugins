# https://cloud.tencent.com/tokenhub/hy4-flash (current promotional rates)
model: hy4-flash
label:
  en_US: hy4-flash
  zh_Hans: hy4-flash
model_type: llm
features:
  - agent-thought
  - vision
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - structured-output
model_properties:
  mode: chat
  context_size: 1048576
  max_output: 65536
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    type: int
    min: 1
    max: 65536
    default: 4096
pricing:
  input: '0.25'
  output: '1.0'
  currency: RMB
  unit: '0.000001'
  rules:
    - component: input
      unit_price: 0.25
      unit_size: 1000000
    - component: output
      unit_price: 1.0
      unit_size: 1000000
    - component: cache_read_input
      unit_price: 0.01
      unit_size: 1000000

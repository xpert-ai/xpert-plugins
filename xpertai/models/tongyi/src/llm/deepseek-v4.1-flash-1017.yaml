# Verified 2026-10-27: https://help.aliyun.com/zh/model-studio/deepseek-api
model: deepseek-v4.1-flash-1017
label:
  en_US: deepseek-v4.1-flash-1017
  zh_Hans: deepseek-v4.1-flash-1017
model_type: llm
features:
  - vision
  - structured-output
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 1
    min: 0
    max: 2
    help:
      zh_Hans: 采样温度，控制模型生成文本的多样性。
      en_US: Sampling temperature, which controls the diversity of generated text.
  - name: max_completion_tokens
    use_template: max_tokens
    type: int
    default: 393216
    min: 1
    max: 393216
    help:
      zh_Hans: 模型输出的最大 Token 数，包含思维链和模型回答。
      en_US: The maximum number of output tokens, including reasoning and the model response.
  - name: reasoning_effort
    label:
      zh_Hans: 思考强度
      en_US: Reasoning Effort
    type: string
    required: false
    default: high
    options:
      - low
      - high
      - max
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
    help:
      zh_Hans: 指定模型必须输出的格式。
      en_US: Specifies the format that the model must output.
  - name: enable_search
    type: boolean
    default: false
    label:
      zh_Hans: 联网搜索
      en_US: Web Search
    help:
      zh_Hans: 是否在生成文本时参考联网搜索结果。
      en_US: Whether to use web search results as a reference when generating text.
  - name: enable_thinking
    required: false
    type: boolean
    default: true
    label:
      zh_Hans: 思考模式
      en_US: Thinking mode
    help:
      zh_Hans: 是否开启思考模式。
      en_US: Whether to enable thinking mode.
  - name: extra_headers
    required: false
    type: string
    label:
      zh_Hans: 额外请求头，Json字符串格式
      en_US: Extra Headers
    help:
      zh_Hans: 以 JSON 字符串格式输入额外的 HTTP 请求头，这些请求头将包含在 API 请求中。
      en_US: Enter extra HTTP headers in JSON string format, which will be included in the API request.

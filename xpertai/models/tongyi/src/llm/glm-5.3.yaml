# https://help.aliyun.com/zh/model-studio/glm-zhipu
model: ZHIPU/GLM-5.3
label:
  en_US: GLM-5.3
  zh_Hans: GLM-5.3
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 65536
    min: 1
    max: 131072
  - name: reasoning_effort
    label:
      zh_Hans: 思考强度
      en_US: Reasoning Effort
    type: string
    default: max
    required: false
    options:
      - low
      - high
      - max
    help:
      zh_Hans: 控制模型的思考强度。GLM-5.3 始终启用思考模式。
      en_US: Controls the model's reasoning effort. GLM-5.3 always uses thinking mode.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: Specifies the format that the model must output
    required: false
    options:
      - text
      - json_object
# https://help.aliyun.com/zh/model-studio/model-pricing
pricing:
  input: '0.008'
  output: '0.028'
  unit: '0.001'
  currency: RMB
  rules:
    - component: input
      unit_price: 8
      unit_size: 1000000
      region: cn
    - component: cache_read_input
      unit_price: 2
      unit_size: 1000000
      region: cn
    - component: output
      unit_price: 28
      unit_size: 1000000
      region: cn

# https://help.aliyun.com/zh/model-studio/qwen4-max
model: qwen4-max
label:
  zh_Hans: qwen4-max
  en_US: qwen4-max
model_type: llm
features:
  - vision
  - video
  - structured-output
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 1.0
    min: 0
    max: 1.99
    help:
      zh_Hans: 控制生成文本的随机性。思考模式默认 1.0，非思考模式默认 0.7。
      en_US: Controls generation randomness. Defaults to 1.0 in thinking mode and 0.7 in non-thinking mode.
  - name: max_completion_tokens
    use_template: max_tokens
    type: int
    default: 131072
    min: 1
    max: 262144
    help:
      zh_Hans: 指定思维链与回复合计的最大 Token 数量。思考模式最多 262144，非思考模式最多 131072。
      en_US: Specifies the maximum total number of tokens for reasoning and the answer. Up to 262144 in thinking mode and 131072 in non-thinking mode.
  - name: top_p
    use_template: top_p
    type: float
    default: null
    min: 0.01
    max: 1.0
    help:
      zh_Hans: 核采样的概率阈值，取值范围为（0, 1.0]。值越大，生成结果越随机。
      en_US: Nucleus sampling threshold in the range (0, 1.0]. Higher values increase randomness.
  - name: enable_search
    type: boolean
    default: false
    label:
      zh_Hans: 联网搜索
      en_US: Web Search
    help:
      zh_Hans: 模型内置了互联网搜索服务，该参数控制模型在生成文本时是否参考使用互联网搜索结果。启用互联网搜索，模型会将搜索结果作为文本生成过程中的参考信息，但模型会基于其内部逻辑"自行判断"是否使用互联网搜索结果。
      en_US: The model has a built-in Internet search service. This parameter controls whether the model refers to Internet search results when generating text. When Internet search
        is enabled, the model will use the search results as reference information in the text generation process, but the model will "judge" whether to use Internet search results based
        on its internal logic.
  - name: enable_thinking
    required: false
    type: boolean
    default: true
    label:
      zh_Hans: 思考模式
      en_US: Thinking mode
    help:
      zh_Hans: 是否开启思考模式。
      en_US: Whether to enable thinking mode.
  - name: reasoning_effort
    required: false
    type: string
    default: high
    options:
      - low
      - high
      - xhigh
    label:
      zh_Hans: 推理强度
      en_US: Reasoning effort
    help:
      zh_Hans: 思考模式的推理强度。
      en_US: Reasoning effort for thinking mode.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
    help:
      zh_Hans: 纯文本输入可选择 JSON Schema。媒体输入请选择 JSON Object，并在提示中描述所需字段。
      en_US: Choose JSON Schema for text-only input. For media input, select JSON Object and describe the required fields in the prompt.
  - name: extra_headers
    required: false
    type: string
    label:
      zh_Hans: 额外请求头，Json字符串格式
      en_US: Extra Headers
    help:
      zh_Hans: 以 JSON 字符串格式输入额外的 HTTP 请求头，这些请求头将包含在 API 请求中。
      en_US: Enter extra HTTP headers in JSON string format, which will be included in the API request.

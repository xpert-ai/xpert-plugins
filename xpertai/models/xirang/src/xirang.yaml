provider: xirang
label:
  en_US: Tianyi Cloud Xirang
  zh_Hans: 天翼云星辰
description:
  en_US: Models hosted by Tianyi Cloud Xirang MaaS.
  zh_Hans: 天翼云星辰 MaaS 平台提供的模型。
help:
  title:
    en_US: Tianyi Cloud Xirang MaaS
    zh_Hans: 天翼云星辰 MaaS
  url:
    en_US: https://ctxirang.ctyun.cn/maas/modelSquare
    zh_Hans: https://ctxirang.ctyun.cn/maas/modelSquare
icon_small:
  en_US: icon.png
  zh_Hans: icon.png
icon_large:
  en_US: icon.png
  zh_Hans: icon.png
supported_model_types:
  - llm
  - text-embedding
  - rerank
  - image
  - speech2text
  - tts
configurate_methods:
  - predefined-model
  - customizable-model
provider_credential_schema:
  credential_form_schemas:
    - variable: app_key
      label:
        en_US: AppKey
        zh_Hans: AppKey
      type: secret-input
      required: true
      placeholder:
        en_US: Enter the Tianyi Cloud Xirang AppKey
        zh_Hans: 输入天翼云星辰 AppKey
    - variable: endpoint_url
      label:
        en_US: API endpoint URL
        zh_Hans: API 端点地址
      type: text-input
      required: false
      placeholder:
        en_US: https://ai.ctaigw.cn/v1
        zh_Hans: https://ai.ctaigw.cn/v1
    - variable: tts_app_id
      label:
        en_US: Speech AppID
        zh_Hans: 语音合成 AppID
      type: text-input
      required: false
      placeholder:
        en_US: AppID for the separate speech service
        zh_Hans: 独立语音服务的 AppID
    - variable: tts_app_key
      label:
        en_US: Speech AppKey
        zh_Hans: 语音合成 AppKey
      type: secret-input
      required: false
      placeholder:
        en_US: AppKey for the separate speech service
        zh_Hans: 独立语音服务的 AppKey
    - variable: tts_region
      label:
        en_US: Speech service region
        zh_Hans: 语音合成区域
      type: text-input
      required: false
      placeholder:
        en_US: Provisioned service region code, e.g. QG or BJ
        zh_Hans: 开通服务的区域代码，例如 QG 或 BJ
model_credential_schema:
  model:
    label:
      en_US: Model name
      zh_Hans: 模型名称
    placeholder:
      en_US: Select a predefined model or enter a model name
      zh_Hans: 选择预置模型或输入模型名称
  credential_form_schemas:
    - variable: display_name
      label:
        en_US: Model display name
        zh_Hans: 模型显示名称
      type: text-input
      required: false
      placeholder:
        en_US: Optional display name
        zh_Hans: 可选的界面显示名称
    - variable: rerank_path
      show_on:
        - variable: __model_type
          value: rerank
      label:
        en_US: Rerank endpoint path
        zh_Hans: Rerank 接口路径
      type: text-input
      required: false
      placeholder:
        en_US: Leave blank to select the endpoint from the predefined model
        zh_Hans: 留空会根据预置模型自动选择接口
    - variable: rerank_auth_scheme
      show_on:
        - variable: __model_type
          value: rerank
      label:
        en_US: Rerank authorization scheme
        zh_Hans: Rerank 鉴权方式
      type: select
      required: false
      default: bearer
      options:
        - value: bearer
          label:
            en_US: Bearer AppKey (official)
            zh_Hans: Bearer AppKey（官方）
        - value: raw
          label:
            en_US: Raw AppKey (custom gateways only)
            zh_Hans: 原始 AppKey（仅自定义网关）
    - variable: rerank_api_key
      show_on:
        - variable: __model_type
          value: rerank
      label:
        en_US: Rerank API key
        zh_Hans: Rerank API Key
      type: secret-input
      required: false
      placeholder:
        en_US: Leave blank to reuse the provider AppKey
        zh_Hans: 留空直接复用提供商 AppKey
    - variable: rerank_instruct
      show_on:
        - variable: __model_type
          value: rerank
      label:
        en_US: Rerank instruction
        zh_Hans: Rerank 指令
      type: text-input
      required: false
      placeholder:
        en_US: Optional instruction for Qwen-compatible Rerank APIs
        zh_Hans: Qwen 兼容 Rerank 接口的可选指令
    - variable: asr_protocol
      label:
        en_US: ASR protocol (leave unset for a preset)
        zh_Hans: ASR 协议（预置模型可留空）
      type: select
      required: false
      options:
        - value: sync
          label:
            en_US: Synchronous recognition
            zh_Hans: 同步识别
        - value: async
          label:
            en_US: Asynchronous file transcription
            zh_Hans: 异步文件转写
      show_on:
        - variable: __model_type
          value: speech2text
    - variable: asr_format
      label:
        en_US: Audio format for synchronous ASR
        zh_Hans: 同步 ASR 音频格式
      type: text-input
      required: false
      default: wav
      show_on:
        - variable: __model_type
          value: speech2text
    - variable: tts_app_id
      label:
        en_US: Speech AppID
        zh_Hans: 语音合成 AppID
      type: text-input
      required: true
      placeholder:
        en_US: AppID for the separate speech service
        zh_Hans: 独立语音服务的 AppID
      show_on:
        - variable: __model_type
          value: tts
    - variable: tts_app_key
      label:
        en_US: Speech AppKey
        zh_Hans: 语音合成 AppKey
      type: secret-input
      required: true
      placeholder:
        en_US: AppKey for the separate speech service
        zh_Hans: 独立语音服务的 AppKey
      show_on:
        - variable: __model_type
          value: tts
    - variable: tts_region
      label:
        en_US: Speech service region
        zh_Hans: 语音合成区域
      type: text-input
      required: true
      placeholder:
        en_US: Provisioned service region code, e.g. QG or BJ
        zh_Hans: 开通服务的区域代码，例如 QG 或 BJ
      show_on:
        - variable: __model_type
          value: tts

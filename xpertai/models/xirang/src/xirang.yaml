provider: xirang
label:
  en_US: Tianyi Cloud Xirang
  zh_Hans: 天翼云星辰
description:
  en_US: Models hosted by Tianyi Cloud Xirang MaaS.
  zh_Hans: 天翼云星辰 MaaS 平台提供的模型。
help:
  title:
    en_US: Tianyi Cloud Xirang MaaS
    zh_Hans: 天翼云星辰 MaaS
  url:
    en_US: https://ctxirang.ctyun.cn/maas/modelSquare
    zh_Hans: https://ctxirang.ctyun.cn/maas/modelSquare
icon_small:
  en_US: icon.png
  zh_Hans: icon.png
icon_large:
  en_US: icon.png
  zh_Hans: icon.png
supported_model_types:
  - llm
  - text-embedding
  - rerank
  - image
configurate_methods:
  - predefined-model
  - customizable-model
provider_credential_schema:
  credential_form_schemas:
    - variable: app_key
      label:
        en_US: AppKey
        zh_Hans: AppKey
      type: secret-input
      required: true
      placeholder:
        en_US: Enter the Tianyi Cloud Xirang AppKey
        zh_Hans: 输入天翼云星辰 AppKey
    - variable: endpoint_url
      label:
        en_US: API endpoint URL
        zh_Hans: API 端点地址
      type: text-input
      required: false
      placeholder:
        en_US: https://ai.ctaigw.cn/v1
        zh_Hans: https://ai.ctaigw.cn/v1
model_credential_schema:
  model:
    label:
      en_US: Model name
      zh_Hans: 模型名称
    placeholder:
      en_US: Select a predefined model or enter a model name
      zh_Hans: 选择预置模型或输入模型名称
  credential_form_schemas:
    - variable: display_name
      label:
        en_US: Model display name
        zh_Hans: 模型显示名称
      type: text-input
      required: false
      placeholder:
        en_US: Optional display name
        zh_Hans: 可选的界面显示名称
    - variable: endpoint_model_name
      label:
        en_US: Endpoint model name
        zh_Hans: API 使用的模型名称
      type: text-input
      required: false
      placeholder:
        en_US: Leave blank to use the selected model name
        zh_Hans: 留空则使用所选模型名称

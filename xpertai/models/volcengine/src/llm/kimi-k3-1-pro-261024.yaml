# Verified 2026-10-27: https://docs.volcengine.com/docs/ark/deep-thinking?lang=zh
model: kimi-k3-1-pro-261024
label:
  en_US: kimi-k3-1-pro-261024
  zh_Hans: kimi-k3-1-pro-261024
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - structured-output
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: reasoning_effort
    label:
      zh_Hans: 思考强度
      en_US: Reasoning Effort
    type: string
    required: false
    default: max
    options:
      - low
      - high
      - max
  - name: max_tokens
    use_template: max_tokens
    type: int
    min: 1
    max: 131072
    default: 4096
pricing:
  input: '13'
  output: '68'
  unit: '0.000001'
  currency: RMB
  source_url: https://docs.volcengine.com/docs/ark/model-pricing?lang=zh
  rules:
    - component: input
      unit_price: 13
      unit_size: 1000000
    - component: output
      unit_price: 68
      unit_size: 1000000
    - component: cache_read_input
      unit_price: 1.3
      unit_size: 1000000
    - component: cache_storage
      unit_price: 0.017
      unit_size: 1000000

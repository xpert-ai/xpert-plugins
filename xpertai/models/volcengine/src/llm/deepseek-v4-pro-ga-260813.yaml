# Verified 2026-10-27: https://docs.volcengine.com/docs/ark/deep-thinking?lang=zh
model: deepseek-v4-pro-ga-260813
label:
  en_US: deepseek-v4-pro-ga-260813
  zh_Hans: deepseek-v4-pro-ga-260813
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - multi-tool-call
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: reasoning_effort
    label:
      zh_Hans: 思考强度
      en_US: Reasoning Effort
    type: string
    required: false
    default: high
    options:
      - none
      - low
      - high
      - max
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 393216
    default: 4096
pricing:
  input: '9'
  output: '27'
  unit: '0.000001'
  currency: RMB
  source_url: https://docs.volcengine.com/docs/ark/model-pricing?lang=zh
  rules:
    - component: cache_read_input
      unit_price: 0.3
      unit_size: 1000000
    - component: cache_storage
      unit_price: 0.017
      unit_size: 1000000

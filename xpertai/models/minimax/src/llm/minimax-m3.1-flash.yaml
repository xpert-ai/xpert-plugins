# Source: langgenius/dify-official-plugins@3189f896; verified 2026-11-03.
model: MiniMax-M3.1-Flash
label:
  en_US: MiniMax-M3.1-Flash
model_type: llm
features:
  - agent-thought
  - vision
  - video
  - document
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 10240
    min: 1
    max: 512000
  - name: reasoning_effort
    label:
      en_US: Effort
      zh_Hans: 思考强度
    type: string
    default: max
    required: false
    help:
      en_US: OpenAI-compatible reasoning_effort. Thinking is always enabled.
      zh_Hans: 通过 reasoning_effort 控制思考强度；思考始终开启。
    options:
      - low
      - medium
      - high
      - xhigh
      - max
pricing:
  input: "1"
  output: "4"
  unit: "0.000001"
  currency: RMB
  source_url: https://platform.minimax.cn/docs/pricing/overview
  rules:
    - component: input
      unit_price: 1
      unit_size: 1000000
    - component: cache_read_input
      unit_price: 0.1
      unit_size: 1000000
    - component: output
      unit_price: 4
      unit_size: 1000000

# https://aistudio.google.com/docs/models/gemini-4-neon
model: gemini-4-neon
label:
  en_US: Gemini 4 Neon
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - agent-thought
  - vision
  - stream-tool-call
  - document
  - video
  - audio
  - structured-output
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: include_thoughts
    type: boolean
    required: true
    default: false
    label:
      en_US: Include thoughts
      zh_Hans: 返回思考过程
    help:
      en_US: Include available thought summaries in the response.
      zh_Hans: 在响应中返回可用的思考摘要。
  - name: thinking_level
    type: string
    required: true
    default: High
    options:
      - Low
      - Medium
      - High
      - Xhigh
    label:
      en_US: Thinking level
      zh_Hans: 思考层级
    help:
      en_US: High is the default. Choose Low for shorter responses or Xhigh for deeper reasoning.
      zh_Hans: 默认为 High。Low 可减少推理时间，Xhigh 可用于需要深入推理的任务。
  - name: max_output_tokens
    use_template: max_tokens
    type: int
    required: true
    default: 8192
    min: 1
    max: 65536
    label:
      en_US: Output length
      zh_Hans: 输出长度
pricing:
  input: '3'
  output: '15'
  currency: USD
  unit: '0.000001'
  rules:
    - component: input
      unit_price: 3
      unit_size: 1000000
    - component: output
      unit_price: 15
      unit_size: 1000000
    - component: cache_read_input
      unit_price: 0.15
      unit_size: 1000000

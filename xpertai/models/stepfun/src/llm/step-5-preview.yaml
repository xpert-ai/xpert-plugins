# Source: langgenius/dify-official-plugins@3189f896; verified 2026-11-03.
model: step-5-preview
label:
  zh_Hans: Step 5 Preview
  en_US: Step 5 Preview
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - video
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 0.5
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
    type: float
    default: 0.9
    min: 0
    max: 1
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 64000
    min: 1
    max: 64000
  - name: reasoning_effort
    label:
      zh_Hans: 推理强度
      en_US: Reasoning Effort
    type: string
    required: false
    default: medium
    options:
      - low
      - medium
      - high
    help:
      zh_Hans: 根据任务复杂度选择推理强度。medium 为默认推荐档位。
      en_US: Select reasoning effort based on task complexity. Medium is recommended by default.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "7"
  output: "20"
  unit: "0.000001"
  currency: RMB
  source_url: https://platform.stepfun.com/docs/zh/guides/pricing/details
  rules:
    - component: input
      unit_price: 7
      unit_size: 1000000
    - component: cache_read_input
      unit_price: 0.7
      unit_size: 1000000
    - component: output
      unit_price: 20
      unit_size: 1000000

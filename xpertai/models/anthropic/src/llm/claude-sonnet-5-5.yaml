# https://platform.claude.com/docs/en/models/overview
model: claude-sonnet-5-5
label:
  en_US: claude-sonnet-5-5
model_type: llm
features:
  - vision
  - document
  - agent-thought
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: effort
    label:
      zh_Hans: 推理投入等级
      en_US: Effort
    type: string
    default: high
    required: true
    options:
      - low
      - medium
      - high
      - xhigh
      - max
    help:
      zh_Hans: '通过 output_config.effort 控制智能/token 消耗的权衡。`medium` 为 Claude Sonnet 5.5 的官方默认值。

        `low` 适合分类、路由、抽取等低延迟、高吞吐场景；需要更深推理时提高到 `high` 或以上，`xhigh`/`max` 建议同时将 max_tokens 设置到 64k 以上。

        注意：关闭推理时 effort 仅支持 `high` 及以下。

        '
      en_US: 'Controls the intelligence vs. token cost trade-off via output_config.effort. `medium` is the official default for Claude Sonnet 5.5.

        Use `low` for latency-sensitive, high-volume work such as classification, routing, and extraction; raise to `high` or above when a task needs deeper reasoning, and with `xhigh`/`max`
        set max_tokens to at least 64k.

        Note: when thinking is disabled, effort is capped at `high`.

        '
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 8192
    min: 1
    max: 128000
  - name: prompt_caching_message_flow
    label:
      zh_Hans: 大消息自动缓存阈值
      en_US: Cache Message Flow Threshold
    type: int
    default: 0
    required: false
    help:
      zh_Hans: 当用户或助手消息的单词数超过此阈值时，自动为该消息添加缓存控制。0 表示禁用。
      en_US: If a user or assistant message exceeds this word count, add cache_control automatically. 0 disables the feature.
  - name: prompt_caching_system_message
    label:
      zh_Hans: 缓存系统消息
      en_US: Cache System Message
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用系统消息的提示缓存。<cache></cache>中的内容将自动缓存。
      en_US: Enable prompt caching for system messages. Content within <cache></cache> will be cached.
  - name: prompt_caching_images
    label:
      zh_Hans: 缓存图片
      en_US: Cache Images
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用图片的提示缓存。
      en_US: Enable prompt caching for images.
  - name: prompt_caching_documents
    label:
      zh_Hans: 缓存文档
      en_US: Cache Documents
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用文档的提示缓存。
      en_US: Enable prompt caching for documents.
  - name: prompt_caching_tool_definitions
    label:
      zh_Hans: 缓存工具定义
      en_US: Cache Tool Definitions
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用工具定义的提示缓存。
      en_US: Enable prompt caching for tool definitions.
  - name: prompt_caching_tool_results
    label:
      zh_Hans: 缓存工具结果
      en_US: Cache Tool Results
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用工具结果的提示缓存。
      en_US: Enable prompt caching for tool results.
pricing:
  input: '2'
  output: '10'
  currency: USD
  unit: '0.000001'
  rules:
    - component: input
      unit_price: 2
      unit_size: 1000000
    - component: output
      unit_price: 10
      unit_size: 1000000
    - component: cache_read_input
      unit_price: 0.1
      unit_size: 1000000
    - component: cache_write_input
      unit_price: 2.5
      cache_ttl: 5m
      unit_size: 1000000
    - component: cache_write_input
      unit_price: 4
      cache_ttl: 1h
      unit_size: 1000000
native_protocols:
  - anthropic_messages

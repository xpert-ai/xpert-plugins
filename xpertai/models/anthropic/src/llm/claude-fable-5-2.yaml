# https://platform.claude.com/docs/en/models/overview
model: claude-fable-5-2
label:
  en_US: claude-fable-5-2
model_type: llm
features:
  - vision
  - document
  - agent-thought
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: effort
    label:
      zh_Hans: 推理投入等级
      en_US: Effort
    type: string
    default: high
    required: false
    options:
      - low
      - medium
      - high
      - xhigh
      - max
    help:
      en_US: High is the API default. Higher settings allow more reasoning tokens.
      zh_Hans: API 默认为 high。更高的档位允许使用更多推理 token。
  - name: max_tokens
    use_template: max_tokens
    required: true
    default: 8192
    min: 1
    max: 128000
  - name: prompt_caching_message_flow
    label:
      zh_Hans: 大消息自动缓存阈值
      en_US: Cache Message Flow Threshold
    type: int
    default: 0
    required: false
    help:
      zh_Hans: 当用户或助手消息的单词数超过此阈值时，自动为该消息添加缓存控制。0 表示禁用。
      en_US: If a user or assistant message exceeds this word count, add cache_control automatically. 0 disables the feature.
  - name: prompt_caching_system_message
    label:
      zh_Hans: 缓存系统消息
      en_US: Cache System Message
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用系统消息的提示缓存。<cache></cache>中的内容将自动缓存。
      en_US: Enable prompt caching for system messages. Content within <cache></cache> will be cached.
  - name: prompt_caching_images
    label:
      zh_Hans: 缓存图片
      en_US: Cache Images
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用图片的提示缓存。
      en_US: Enable prompt caching for images.
  - name: prompt_caching_documents
    label:
      zh_Hans: 缓存文档
      en_US: Cache Documents
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用文档的提示缓存。
      en_US: Enable prompt caching for documents.
  - name: prompt_caching_tool_definitions
    label:
      zh_Hans: 缓存工具定义
      en_US: Cache Tool Definitions
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用工具定义的提示缓存。
      en_US: Enable prompt caching for tool definitions.
  - name: prompt_caching_tool_results
    label:
      zh_Hans: 缓存工具结果
      en_US: Cache Tool Results
    type: boolean
    default: true
    required: false
    help:
      zh_Hans: 启用工具结果的提示缓存。
      en_US: Enable prompt caching for tool results.
pricing:
  input: '8'
  output: '40'
  currency: USD
  unit: '0.000001'
  rules:
    - component: input
      unit_price: 8
      unit_size: 1000000
    - component: output
      unit_price: 40
      unit_size: 1000000
    - component: cache_read_input
      unit_price: 0.2
      unit_size: 1000000
    - component: cache_write_input
      unit_price: 10.0
      cache_ttl: 5m
      unit_size: 1000000
    - component: cache_write_input
      unit_price: 16
      cache_ttl: 1h
      unit_size: 1000000
native_protocols:
  - anthropic_messages

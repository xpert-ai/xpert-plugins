# https://openrouter.ai/anthropic/claude-fable-5.2
model: anthropic/claude-fable-5.2
label:
  en_US: 'Anthropic: Claude Fable 5.2'
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - structured-output
  - vision
  - document
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    type: int
    min: 1
    max: 128000
    default: 4096
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: '8.0'
  output: '40.0'
  currency: USD
  unit: '0.000001'
  rules:
    - component: input
      unit_price: 8.0
      unit_size: 1000000
    - component: output
      unit_price: 40.0
      unit_size: 1000000
    - component: cache_read_input
      unit_price: 0.2
      unit_size: 1000000
  source_url: https://openrouter.ai/anthropic/claude-fable-5.2

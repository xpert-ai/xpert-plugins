# https://openrouter.ai/openai/gpt-6.2-sol
model: openai/gpt-6.2-sol
label:
  en_US: 'OpenAI: GPT-6.2 Sol'
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - structured-output
  - vision
  - document
model_properties:
  mode: chat
  context_size: 1050000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    type: int
    min: 1
    max: 128000
    default: 4096
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: '2.0'
  output: '10.0'
  currency: USD
  unit: '0.000001'
  rules:
    - component: input
      unit_price: 2.0
      unit_size: 1000000
    - component: output
      unit_price: 10.0
      unit_size: 1000000
    - component: cache_read_input
      unit_price: 0.1
      unit_size: 1000000
  source_url: https://openrouter.ai/openai/gpt-6.2-sol

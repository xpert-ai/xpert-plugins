# https://openrouter.ai/qwen/qwen4-max
model: qwen/qwen4-max
label:
  en_US: 'Qwen: Qwen4 Max'
model_type: llm
features:
  - agent-thought
  - tool-call
  - stream-tool-call
  - structured-output
  - vision
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    type: int
    min: 1
    max: 131072
    default: 4096
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: '1.425'
  output: '4.275'
  currency: USD
  unit: '0.000001'
  rules:
    - component: input
      unit_price: 1.425
      unit_size: 1000000
    - component: output
      unit_price: 4.275
      unit_size: 1000000
    - component: cache_read_input
      unit_price: 0.07125
      unit_size: 1000000
  source_url: https://openrouter.ai/qwen/qwen4-max

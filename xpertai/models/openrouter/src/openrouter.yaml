provider: openrouter
label:
  en_US: OpenRouter
  zh_Hans: OpenRouter
description:
  en_US: Access OpenRouter language, embedding, and rerank models through a unified API.
  zh_Hans: 通过统一 API 使用 OpenRouter 的语言、嵌入与重排模型。
background: '#F1EFED'
configurate_methods:
  - predefined-model
  - customizable-model
help:
  title:
    en_US: Get your API key from openrouter.ai
    zh_Hans: 从 openrouter.ai 获取 API Key
  url:
    en_US: https://openrouter.ai/keys
icon_large:
  en_US: openrouter.svg
icon_small:
  en_US: openrouter_square.svg
model_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API Key
      placeholder:
        en_US: Enter your API Key
        zh_Hans: 在此输入您的 API Key
      required: true
      type: secret-input
    - variable: endpoint_url
      label:
        en_US: API Base URL
        zh_Hans: API Base URL
      placeholder:
        en_US: Base URL, e.g. https://openrouter.ai/api/v1
        zh_Hans: Base URL，例如 https://openrouter.ai/api/v1
      required: false
      type: text-input
    - variable: mode
      default: chat
      label:
        en_US: Completion mode
        zh_Hans: 补全模式
      options:
        - label:
            en_US: Completion
            zh_Hans: 补全
          value: completion
        - label:
            en_US: Chat
            zh_Hans: 对话
          value: chat
      placeholder:
        en_US: Select completion mode
        zh_Hans: 选择对话类型
      required: false
      show_on:
        - value: llm
          variable: __model_type
      type: select
    - variable: context_size
      default: '4096'
      label:
        en_US: Model context size
        zh_Hans: 模型上下文长度
      placeholder:
        en_US: Enter the model context size
        zh_Hans: 在此输入模型上下文长度
      required: true
      type: text-input
    - variable: max_tokens_to_sample
      default: '4096'
      label:
        en_US: Upper bound for max tokens
        zh_Hans: 最大 token 上限
      required: false
      show_on:
        - value: llm
          variable: __model_type
      type: text-input
    - variable: vision_support
      default: no_support
      label:
        en_US: Vision support
        zh_Hans: 是否支持视觉输入
      options:
        - label:
            en_US: 'Yes'
            zh_Hans: 是
          value: support
        - label:
            en_US: 'No'
            zh_Hans: 否
          value: no_support
      required: false
      show_on:
        - value: llm
          variable: __model_type
      type: radio
    - variable: reasoning_support
      default: no_support
      label:
        en_US: Reasoning support
        zh_Hans: 是否支持推理
      options:
        - label:
            en_US: 'Yes'
            zh_Hans: 是
          value: support
        - label:
            en_US: 'No'
            zh_Hans: 否
          value: no_support
      required: false
      show_on:
        - value: llm
          variable: __model_type
      type: radio
    - variable: structured_output_support
      default: no_support
      label:
        en_US: Structured output support
        zh_Hans: 是否支持结构化输出
      options:
        - label:
            en_US: 'Yes'
            zh_Hans: 是
          value: support
        - label:
            en_US: 'No'
            zh_Hans: 否
          value: no_support
      required: false
      show_on:
        - value: llm
          variable: __model_type
      type: radio
    - variable: function_calling_type
      default: no_call
      label:
        en_US: Function calling
        zh_Hans: 工具调用
      options:
        - label:
            en_US: Not supported
            zh_Hans: 不支持
          value: no_call
        - label:
            en_US: Supported
            zh_Hans: 支持
          value: tool_call
      required: false
      show_on:
        - value: llm
          variable: __model_type
      type: select
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter the full OpenRouter model name
      zh_Hans: 输入 OpenRouter 模型全称
models:
  llm:
    position: llm/_position.yaml
    predefined:
      - llm/*.yaml
  rerank:
    position: rerank/_position.yaml
    predefined:
      - rerank/*.yaml
  text-embedding:
    position: text-embedding/_position.yaml
    predefined:
      - text-embedding/*.yaml
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API Key
      placeholder:
        en_US: Enter your API Key
        zh_Hans: 在此输入您的 API Key
      required: true
      type: secret-input
    - variable: endpoint_url
      label:
        en_US: API Base URL
        zh_Hans: API Base URL
      placeholder:
        en_US: Base URL, e.g. https://openrouter.ai/api/v1
        zh_Hans: Base URL，例如 https://openrouter.ai/api/v1
      required: false
      type: text-input
supported_model_types:
  - llm
  - rerank
  - text-embedding

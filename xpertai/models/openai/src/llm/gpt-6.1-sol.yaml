# Source: https://developers.openai.com/api/docs/models/gpt-6.1-sol (2026-10-30)
model: gpt-6.1-sol
native_protocols:
  - openai_responses
label:
  en_US: GPT-6.1 Sol
  zh_Hans: GPT-6.1 Sol
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - structured-output
  - vision
model_properties:
  mode: chat
  context_size: 1050000
  max_output: 128000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 32768
    min: 16
    max: 128000
    help:
      en_US: Maximum output tokens, including reasoning tokens. Input and output must fit within the context window.
      zh_Hans: 最大输出 Token 数，包含推理 Token；输入和输出合计须在上下文窗口内。
  - name: reasoning_effort
    label:
      en_US: Reasoning Effort
      zh_Hans: 推理力度
    type: string
    required: false
    default: medium
    options:
      - low
      - medium
      - high
      - xhigh
      - max
    help:
      en_US: Higher effort can improve reasoning at the cost of latency and output tokens. Sampling parameters apply only with none.
      zh_Hans: 更高档位可增强推理，但会增加延迟和输出 Token；采样参数仅在 none 档位生效。
  - name: response_format
    label:
      en_US: Response Format
      zh_Hans: 回复格式
    type: string
    required: false
    options:
      - text
      - json_object
pricing:
  input: '2'
  output: '10'
  unit: '0.000001'
  currency: USD
  # Standard processing; long-context rates apply to the entire request above 272K input tokens.
  tiered_pricing:
    - input: 2
      output: 10
      max_tokens: 272000
    - input: 4
      output: 15.0
      max_tokens: 1050000
  rules:
    - component: input
      unit_price: 2
      unit_size: 1000000
      max_input_tokens: 272000
    - component: output
      unit_price: 10
      unit_size: 1000000
      max_input_tokens: 272000
    - component: cache_read_input
      unit_price: 0.1
      unit_size: 1000000
      max_input_tokens: 272000
    - component: cache_write_input
      unit_price: 2.50
      unit_size: 1000000
      max_input_tokens: 272000
    - component: input
      unit_price: 4
      unit_size: 1000000
      min_input_tokens: 272001
    - component: output
      unit_price: 15.0
      unit_size: 1000000
      min_input_tokens: 272001
    - component: cache_read_input
      unit_price: 0.2
      unit_size: 1000000
      min_input_tokens: 272001
    - component: cache_write_input
      unit_price: 5.00
      unit_size: 1000000
      min_input_tokens: 272001

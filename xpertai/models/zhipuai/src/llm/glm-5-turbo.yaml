model: glm-5-turbo
label:
  en_US: glm-5-turbo
  zh_Hans: glm-5-turbo
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 204800
parameter_rules:
  - name: thinking
    label:
      zh_Hans: 推理模式
      en_US: Thinking Mode
    type: string
    default: disabled
    required: false
    options:
      - enabled
      - disabled
    help:
      zh_Hans: 控制模型的推理能力。
      en_US: Controls the model's thinking capability.
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    help:
      zh_Hans: 指定模型必须输出的格式
      en_US: specifying the format that the model must output
    required: false
    options:
      - text
      - json_object
pricing:
  input: "0.005"
  output: "0.022"
  unit: "0.001"
  currency: RMB
  rules:
    - component: input
      unit_price: 5
      unit_size: 1000000
      max_input_tokens: 31999
    - component: output
      unit_price: 22
      unit_size: 1000000
      max_input_tokens: 31999
    - component: cache_read_input
      unit_price: 1.2
      unit_size: 1000000
      max_input_tokens: 31999
    - component: input
      unit_price: 7
      unit_size: 1000000
      min_input_tokens: 32000
      max_input_tokens: 200000
    - component: output
      unit_price: 26
      unit_size: 1000000
      min_input_tokens: 32000
      max_input_tokens: 200000
    - component: cache_read_input
      unit_price: 1.8
      unit_size: 1000000
      min_input_tokens: 32000
      max_input_tokens: 200000

model: glm-5.2
label:
  en_US: GLM-5.2
  zh_Hans: GLM-5.2
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 65536
    min: 1
    max: 131072
  - name: web_search
    type: boolean
    label:
      zh_Hans: 联网搜索
      en_US: Web Search
    default: false
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
pricing:
  input: '0.008'
  output: '0.028'
  unit: '0.001'
  currency: RMB
  rules:
    - component: input
      unit_price: 8
      unit_size: 1000000
    - component: cache_read_input
      unit_price: 2
      unit_size: 1000000
    - component: output
      unit_price: 28
      unit_size: 1000000

model: glm-5.3
label:
  en_US: GLM-5.3
  zh_Hans: GLM-5.3
model_type: llm
features:
  - multi-tool-call
  - agent-thought
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 131072
  - name: response_format
    label:
      zh_Hans: 回复格式
      en_US: Response Format
    type: string
    required: false
    options:
      - text
      - json_object
# https://docs.bigmodel.cn/cn/guide/start/pricing
pricing:
  input: '0.008'
  output: '0.028'
  unit: '0.001'
  currency: RMB
  rules:
    - component: input
      unit_price: 8
      unit_size: 1000000
    - component: cache_read_input
      unit_price: 2
      unit_size: 1000000
    - component: output
      unit_price: 28
      unit_size: 1000000

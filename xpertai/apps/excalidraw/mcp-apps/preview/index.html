<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excalidraw Preview</title><style>
:root{--preview-bg:#fff;--preview-surface:#f5f6f9;--preview-text:#20212c;--preview-muted:#636573;--preview-border:#d8dae1}[data-theme="dark"]{--preview-bg:#17191f;--preview-surface:#22252e;--preview-text:#eff0f5;--preview-muted:#b1b5c4;--preview-border:#3e4250}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--color-background-primary,var(--preview-bg));color:var(--color-text-primary,var(--preview-text));font-family:var(--font-sans,system-ui,sans-serif);font-size:14px}header,.toolbar,footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:12px}h1{font-size:17px;margin:0}#drawing-title{margin:4px 0;color:var(--color-text-secondary,var(--preview-muted));font-size:13px}.toolbar{margin-bottom:10px}button{font:inherit;border:1px solid var(--color-border-primary,var(--preview-border));border-radius:7px;background:var(--color-background-secondary,var(--preview-surface));color:inherit;padding:7px 10px;cursor:pointer}button:hover{filter:brightness(.96)}button:focus-visible,#viewport:focus-visible{outline:2px solid var(--color-ring-primary,#6965db);outline-offset:2px}#viewport{position:relative;overflow:hidden;height:420px;min-height:240px;border:1px solid var(--color-border-primary,var(--preview-border));border-radius:10px;background:var(--color-background-secondary,var(--preview-surface));touch-action:none;cursor:grab}#viewport:active{cursor:grabbing}#image{position:absolute;max-width:none;transform-origin:0 0;user-select:none;pointer-events:none}footer{justify-content:space-between;margin-top:10px;font-size:12px;color:var(--color-text-secondary,var(--preview-muted))}#status{margin:9px 0;min-height:20px}#status[data-state=failed],#status[data-state=stale]{color:var(--color-text-danger,#a74321)}#quality-panel{margin-top:12px;padding:12px;border:1px solid var(--color-border-primary,var(--preview-border));border-radius:8px;max-height:220px;overflow:auto;white-space:pre-wrap}#help{font-size:12px;color:var(--color-text-secondary,var(--preview-muted))}@media(max-width:500px){body{padding:10px}#viewport{height:330px}}
</style></head><body><header><div><h1 data-i18n="title"></h1><p id="drawing-title"></p></div><button id="refresh" data-i18n="retry"></button></header><div class="toolbar"><button id="out" data-label="zoomOut">−</button><span id="zoom">100%</span><button id="in" data-label="zoomIn">+</button><button id="fit" data-i18n="fit"></button><button id="quality" data-i18n="quality"></button></div><p id="status" role="status" aria-live="polite"></p><div id="viewport" tabindex="0" role="region" aria-label="Drawing preview"><img id="image" hidden draggable="false" alt=""></div><footer><span id="details"></span></footer><p id="help" data-i18n="instructions"></p><div id="quality-panel" hidden></div><script>/* APP_SCRIPT */</script></body></html>

interface:
  display_name: "实时看板"
  short_description: "使用沙箱文件工具编辑页面并保存看板草稿"
runtime:
  required_tools:
    - kind: agent-middleware-tool
      provider: skillsMiddleware
      name: read_skill_file
      required: true
    - kind: agent-middleware-tool
      provider: SandboxFile
      name: sandbox_write_file
      required: true
    - kind: agent-middleware-tool
      provider: SandboxFile
      name: sandbox_read_file
      required: true
    - kind: agent-middleware-tool
      provider: SandboxFile
      name: sandbox_edit_file
      required: true

team:
  name: cut-assistant
  type: agent
  title: Cut Assistant
  description:
    en_US: Agentic non-linear video editor with scoped media intelligence, evidence-backed edit proposals, deterministic timeline edits, reviewable captions, versioning, and browser or headless export
    zh_Hans: 支持作用域媒体内容理解、证据化剪辑提案、确定性时间线编辑、可审阅字幕、版本以及浏览器或后台导出的智能非线性视频剪辑助手
  avatar:
    url: "__CUT_ICON_DATA_URL__"
  options:
    templateKey: cut-assistant
    dataXpert:
      managedBy: data-xpert
      templateKey: cut-assistant
      assistantKind: business-assistant
      businessDomain: cut
      requiredPlugin: '@xpert-ai/plugin-cut'
      requiredPlugins: ['@xpert-ai/plugin-cut']
      requiredCapabilities: [cut, cut-workbench, cut-agent]
  agentConfig:
    stateVariables:
      - name: cutProjectId
        type: string
        default: ''
        description: Current Cut project id
      - name: cutRevision
        type: string
        default: ''
        description: Current Cut project revision
      - name: cutSelectedClipId
        type: string
        default: ''
        description: Current selected clip id
      - name: cutDirty
        type: string
        default: ''
        description: Whether Workbench has local unsaved edits
    recursionLimit: 10000
  version: '1'
  agent: { key: Agent_Cut }
  copilotModel:
    referencedId: null
    modelType: llm
    model: qwen3.6-plus
    options: { context_size: 1000000, temperature: 0.2, maxRetries: 6, max_tokens: 8192 }
nodes:
  - type: agent
    key: Agent_Cut
    position: { x: 800, y: 20 }
    entity:
      key: Agent_Cut
      name: cut-assistant
      title: Cut Assistant
      prompt: >
        You are Cut Assistant. Cut tools are the system of record: claim a saved
        edit or artifact only after its tool succeeds. Load cut-agent-skill for
        project identity, revision-safe editing and content authorization. Load
        cut-speech-editing for speech cleanup or rough cuts, cut-captions for
        transcription and subtitles, cut-verification for evidence and result
        checks, and cut-export for background rendering and delivery. Use the
        available skill reader and load only the current workflow. Follow those
        packaged skills as the workflow source of truth.
        Workbench selection is supplied in cut.currentProject and mirrored in
        cutProjectId, cutRevision, cutSelectedClipId and cutDirty. Middleware may
        resolve an omitted projectId to the active selection; when targeting
        another project use its exact UUID. For standalone MCP always pass the
        explicit Cut projectId. Never substitute it for a platform Assistant ID.
        Read cut_get_project before mutations and use its current baseRevision.
        Preserve dirty Workbench edits and refresh on revision conflicts.
        Reuse existing user approval for the same project, content and edits;
        validate before applying and ask only about new or changed decisions.
        Honor explicit requests to preview or wait. Platform authorization and
        tool confirmation remain mandatory and cannot be replaced by conversation
        approval. Match the user's language. Report failures and outstanding
        jobs explicitly; job submission is not completed media delivery.
      collaboratorNames: []
      toolsetIds: []
      knowledgebaseIds: []
    hash: cut-agent-v12
  - type: workflow
    key: Middleware_Cut
    position: { x: 600, y: 320 }
    entity: { type: middleware, key: Middleware_Cut, title: Cut Agent Tools, provider: CutMiddleware, required: true }
    hash: cut-tools-v1
  - type: workflow
    key: Middleware_Skills
    position: { x: 1000, y: 320 }
    entity: { type: middleware, key: Middleware_Skills, title: Skills Middleware, provider: skillsMiddleware, required: true }
    hash: cut-skills-v1
connections:
  - { type: workflow, key: Agent_Cut/Middleware_Cut, from: Agent_Cut, to: Middleware_Cut }
  - { type: workflow, key: Agent_Cut/Middleware_Skills, from: Agent_Cut, to: Middleware_Skills }

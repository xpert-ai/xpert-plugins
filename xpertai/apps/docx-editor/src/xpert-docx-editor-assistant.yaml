team:
  name: docx-editor-assistant
  type: agent
  title: DOCX 文档审阅助手
  description:
    en_US: Business assistant for DOCX online editing, comments, tracked-change suggestions, and versioned saving
    zh_Hans: 面向 DOCX 在线编辑、批注、修订建议和版本化保存的业务助手
  avatar:
    emoji:
      id: memo
    background: rgb(219, 234, 254)
  options:
    templateKey: docx-editor-assistant
    dataXpert:
      managedBy: data-xpert
      templateKey: docx-editor-assistant
      assistantKind: business-assistant
      businessDomain: docx-editor
      requiredPlugin: '@xpert-ai/plugin-docx-editor'
      requiredPlugins:
        - '@xpert-ai/plugin-docx-editor'
      requiredCapabilities:
        - docx-editor
        - docx-editor-workbench
        - docx-editor-agent-review
  agentConfig:
    stateVariables:
      - name: currentDocumentId
        type: string
        default: ""
        description: Current DOCX Editor document id selected in the Workbench
        operation: null
    recursionLimit: 10000
  features:
    sandbox:
      enabled: true
      provider: docker-sandbox
  version: "1"
  agent:
    key: Agent_DocxEditor
  copilotModel:
    referencedId: null
    modelType: llm
    model: qwen3.6-plus
    options:
      context_size: 1000000
      temperature: 0.2
      maxRetries: 6
      max_tokens: 8192
      top_p: 0.95
  knowledgebases: []
  toolsets: []
  tags: []
nodes:
  - type: agent
    key: Agent_DocxEditor
    position:
      x: 860
      y: 20
    entity:
      key: Agent_DocxEditor
      name: docx-editor-assistant
      title: DOCX 文档审阅助手
      description:
        en_US: Business assistant for DOCX online editing, comments, tracked-change suggestions, and versioned saving
        zh_Hans: 面向 DOCX 在线编辑、批注、修订建议和版本化保存的业务助手
      avatar:
        emoji:
          id: memo
        background: rgb(219, 234, 254)
      prompt: >
        You are DOCX Editor Assistant, a data-xpert business assistant for
        DOCX document reading, browser editing, comments, tracked changes,
        formatting, and versioned review.

        Use explicit DOCX Editor context when reviewing or editing an existing
        document. Creating or importing a new document does not require an open
        Workbench document. The DOCX Editor Workbench
        can set the current document through Assistant runtime context; when a
        "Current DOCX Workbench document context" system message is present,
        docx_* tools may omit documentId and the middleware will target that
        current document. If the user message, tool result, or currentDocumentId
        state supplies a different documentId, pass it explicitly. Do not invent
        document ids, paragraph ids, comment ids, version ids, or file names.

        Document review workflow:
        1. When the user asks you to create or generate a DOCX, create the native
        .docx inside the current Agent runtime workspace, then call
        docx_import_workspace_file with its /workspace path or portable Workspace
        File reference. Use the returned documentId for all later calls. Do not
        ask the user to upload or open the generated file merely because the
        Workbench was initially empty. Never pass an arbitrary host path outside
        the runtime workspace. Ask the user to upload/select a document only when
        the request concerns an existing document and neither document context,
        documentId, nor an accessible workspace DOCX file is available.
        2. Call docx_read_document or docx_find_text before adding comments, suggesting changes, or applying formatting; use tools for document text and review details because the current document context contains only lightweight metadata.
        3. Use stable paraId handles returned by the tools. Never locate paragraphs by display order, localized labels, or guessed text combinations.
        4. For comments, call docx_add_comment with paraId, text, and optional search when the phrase is unique.
        5. For edits, follow the current Workbench mode when it is available: in suggesting mode prefer docx_suggest_change so the user can accept or reject tracked changes; in editing mode direct modification tools are acceptable when they exist; in viewing mode treat the document as read-only unless the user explicitly asks to modify it.
        6. For formatting, call docx_apply_formatting or docx_set_paragraph_style only after confirming the target paraId.
        7. Use docx_read_comments and docx_read_changes to summarize pending review items.
        8. To process review items, use docx_accept_change, docx_reject_change, docx_accept_all_changes, docx_reject_all_changes, docx_resolve_comment, docx_resolve_all_comments, docx_delete_comment, or docx_delete_all_comments after reading current ids.
        9. Use docx_read_selection, docx_read_page, docx_read_pages, and docx_scroll only when the Workbench has a live snapshot; if unavailable, ask the user to open the Workbench.
        10. When the user explicitly asks for a public link, first ensure the DOCX
        is an official saved DOCX Editor version (call docx_import_workspace_file
        for a newly generated workspace file), then call
        docx_publish_artifact_link with that returned documentId and
        userConfirmedPublicLink=true. Keep targetMode=version unless the user asks
        for a moving latest-version link. The Workbench and public page must use
        that same saved version; never claim a sandbox file path itself is a
        public link.

        Do not claim a document was saved unless a tool or Workbench action returns a saved version. Prefer concise Chinese responses unless the user asks otherwise.
      collaboratorNames: []
      toolsetIds: []
      knowledgebaseIds: []
    hash: docx-editor-agent-v2
  - type: workflow
    key: Middleware_DocxEditor
    position:
      x: 1160
      y: 332
    entity:
      type: middleware
      key: Middleware_DocxEditor
      title: DOCX Editor Tools
      provider: DocxEditorMiddleware
      required: true
    hash: docx-editor-middleware-v1
  - type: workflow
    key: Middleware_WebTools
    position: { x: 820, y: 480 }
    entity:
      type: middleware
      key: Middleware_WebTools
      title: Web Tools
      provider: WebTools
      required: true
    hash: docx-editor-web-tools-middleware-v1
  - type: workflow
    key: Middleware_SandboxFile
    position: { x: 1460, y: 332 }
    entity:
      type: middleware
      key: Middleware_SandboxFile
      title: Sandbox File
      provider: SandboxFile
      required: true
    hash: docx-editor-sandbox-file-middleware-v1
  - type: workflow
    key: Middleware_SandboxShell
    position: { x: 1460, y: 480 }
    entity:
      type: middleware
      key: Middleware_SandboxShell
      title: Sandbox Shell
      provider: SandboxShell
      required: true
    hash: docx-editor-sandbox-shell-middleware-v1
  - type: workflow
    key: Middleware_LoopGuard
    position: { x: 960, y: 660 }
    entity:
      type: middleware
      key: Middleware_LoopGuard
      title: Loop Guard
      provider: LoopGuardMiddleware
      required: true
    hash: docx-editor-loop-guard-middleware-v1
  - type: workflow
    key: Middleware_ModelRetry
    position: { x: 1160, y: 520 }
    entity:
      type: middleware
      key: Middleware_ModelRetry
      title: Model Retry
      provider: ModelRetryMiddleware
      required: true
      options:
        maxRetries: 2
        initialDelayMs: 1000
        backoffFactor: 2
        maxDelayMs: 60000
        jitter: true
        retryAllErrors: true
        retryableErrorNames: []
        retryableStatusCodes: []
        retryableMessageIncludes: []
        onFailure: continue
    hash: docx-editor-model-retry-middleware-v1
  - type: workflow
    key: Middleware_ViewImage
    position: { x: 1720, y: 480 }
    entity:
      type: middleware
      key: Middleware_ViewImage
      title: View Image
      provider: ViewImageMiddleware
      required: true
    hash: docx-editor-view-image-middleware-v1
connections:
  - type: workflow
    key: Agent_DocxEditor/Middleware_DocxEditor
    from: Agent_DocxEditor
    to: Middleware_DocxEditor
  - type: workflow
    key: Agent_DocxEditor/Middleware_WebTools
    from: Agent_DocxEditor
    to: Middleware_WebTools
  - type: workflow
    key: Agent_DocxEditor/Middleware_SandboxFile
    from: Agent_DocxEditor
    to: Middleware_SandboxFile
  - type: workflow
    key: Agent_DocxEditor/Middleware_SandboxShell
    from: Agent_DocxEditor
    to: Middleware_SandboxShell
  - type: workflow
    key: Agent_DocxEditor/Middleware_LoopGuard
    from: Agent_DocxEditor
    to: Middleware_LoopGuard
  - type: workflow
    key: Agent_DocxEditor/Middleware_ModelRetry
    from: Agent_DocxEditor
    to: Middleware_ModelRetry
  - type: workflow
    key: Agent_DocxEditor/Middleware_ViewImage
    from: Agent_DocxEditor
    to: Middleware_ViewImage

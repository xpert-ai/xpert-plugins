      type: middleware
      key: Middleware_StoryStudio
      title: Story Studio Agent Tools
      provider: StoryStudioMiddleware
      required: true
    hash: story-studio-tools-v2
  - type: workflow
    key: Middleware_CutHandoff
    position:
      x: 1320
      y: 300

          enabled: true
        - id: 080e096f-519c-4673-9ba9-087596be07d1
          name: seedance_image_to_video
          enabled: true
        - id: ad7db032-4b91-400a-8821-1a0208882ce8
          name: seedance_text_to_video
          enabled: true
        - id: 332c108a-9fd5-4a7e-9aee-f9fd83d16cc0
          name: seedance_multimodal_reference_to_video

team:
  name: support-ticket-assistant
  type: agent
  title: 客服工单助手
  description: 面向客户消息分类定级、回复草稿生成与人工确认归档的业务助手
  avatar:
    emoji:
      id: headset
    background: rgb(219, 234, 254)
  options:
    templateKey: support-ticket-assistant
    dataXpert:
      managedBy: data-xpert
      templateKey: support-ticket-assistant
      assistantKind: business-assistant
      businessDomain: support-ticket
      requiredPlugin: '@xpert-ai/plugin-support-ticket'
      requiredPlugins:
        - '@xpert-ai/plugin-support-ticket'
      requiredCapabilities:
        - support_ticket
        - support-ticket-review-desk
  agentConfig:
    stateVariables:
      - name: currentTicketId
        type: string
        default: ""
        description: Support ticket id currently selected in the workbench
        operation: null
    recursionLimit: 10000
  version: "1"
  agent:
    key: Agent_SupportTicket
  copilotModel:
    referencedId: null
    modelType: llm
    model: qwen3.6-plus
    options:
      context_size: 128000
      temperature: 0.2
      maxRetries: 6
      max_tokens: 4096
      top_p: 0.95
  knowledgebases: []
  toolsets: []
  tags: []
nodes:
  - type: agent
    key: Agent_SupportTicket
    position:
      x: 860
      y: 20
    entity:
      key: Agent_SupportTicket
      name: support-ticket-assistant
      title: 客服工单助手
      description: 面向客户消息分类定级、回复草稿生成与人工确认归档的业务助手
      avatar:
        emoji:
          id: headset
        background: rgb(219, 234, 254)
      prompt: >
        You are the Support Ticket assistant for a B2B customer service team. Every
        customer message submitted from the Support Ticket Workbench is already stored
        as a ticket with a ticketId before you are asked to process it.

        When the user asks to process a ticket, call support_ticket_save_triage exactly
        once with that ticketId and provide: category (from the supported list),
        priority (p0 blocking, p1 high, p2 normal, p3 low), priorityReason quoting the
        customer impact found in the message, draftReply in the customer's language, and
        missingInfo for anything you could not find.

        Never invent order numbers, amounts, deadlines, responsible people or root
        causes. Never claim the reply was sent: sending is a human action. Never confirm
        a ticket, and never overwrite a confirmed ticket. If the message is ambiguous,
        choose the closest supported category and list the unclear points in missingInfo
        instead of guessing.

        For backlog questions call support_ticket_search_tickets, and for a known ticket
        call support_ticket_get_ticket_detail with the exact ticketId. After a tool call,
        reply with one short paragraph stating the category, the priority and what the
        human reviewer must confirm. Prefer concise Chinese for end users unless they
        ask otherwise.
      collaboratorNames: []
      toolsetIds: []
      knowledgebaseIds: []
    hash: support-ticket-agent-v1
  - type: workflow
    key: Middleware_SupportTicket
    position:
      x: 1160
      y: 332
    entity:
      type: middleware
      key: Middleware_SupportTicket
      title: Support Ticket Tools
      provider: SupportTicketMiddleware
      required: true
    hash: support-ticket-middleware-v1
connections:
  - type: workflow
    key: Agent_SupportTicket/Middleware_SupportTicket
    from: Agent_SupportTicket
    to: Middleware_SupportTicket

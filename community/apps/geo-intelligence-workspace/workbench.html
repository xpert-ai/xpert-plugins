<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO Hub - 工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1628;color:#e0e6ed;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(0,255,136,.2);border-radius:3px}
.bg-p{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;overflow:hidden}
.bg-p span{position:absolute;width:3px;height:3px;background:#00ff88;border-radius:50%;animation:r linear infinite;box-shadow:0 0 4px #00ff88}
@keyframes r{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.6}100%{transform:translateY(-5vh) scale(1);opacity:0}}
.nav{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:48px;background:rgba(10,22,40,.95);border-bottom:1px solid rgba(0,255,136,.2)}
.nav-l{display:flex;align-items:center;gap:10px}
.nav-logo{width:28px;height:28px;border:1.5px solid #00ff88;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#00ff88;font-size:14px}
.nav-t{font-size:15px;font-weight:700;color:#00ff88;letter-spacing:2px}
.nav-s{color:#7a8ba0;font-size:10px;letter-spacing:2px;margin-left:8px}
.nav-r{display:flex;align-items:center;gap:10px;color:#7a8ba0;font-size:13px}
.btn-out{background:none;border:1px solid rgba(255,68,102,.3);border-radius:5px;padding:4px 10px;color:#ff4466;cursor:pointer;font-size:12px}
.btn-out:hover{background:rgba(255,68,102,.1)}
.grid{position:relative;z-index:1;display:grid;grid-template-columns:240px 1fr 280px;gap:1px;height:calc(100vh - 48px);background:rgba(0,255,136,.04)}
.col{background:rgba(10,22,40,.92);overflow-y:auto;padding:14px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(0,255,136,.15)}
.hdr-t{font-size:11px;font-weight:600;color:#7a8ba0;letter-spacing:2px}
.hdr-b{font-size:10px;color:#00ff88;background:rgba(0,255,136,.1);padding:1px 7px;border-radius:8px;border:1px solid rgba(0,255,136,.2)}
.btn{border:none;border-radius:5px;padding:7px 14px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:5px}
.btn-g{background:linear-gradient(135deg,#00ff88,#00d4ff);color:#0a1628}.btn-g:hover{box-shadow:0 0 12px rgba(0,255,136,.3)}
.btn-g:disabled{opacity:.5;cursor:not-allowed}
.btn-b{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.25);color:#00d4ff}.btn-b:hover{background:rgba(0,212,255,.2)}
.btn-o{background:none;border:1px solid rgba(0,255,136,.2);color:#7a8ba0}.btn-o:hover{border-color:#00ff88;color:#00ff88}
.btn-d{background:rgba(255,68,102,.1);border:1px solid rgba(255,68,102,.25);color:#ff4466}.btn-d:hover{background:rgba(255,68,102,.2)}
.btn-s{padding:4px 8px;font-size:11px}
.btn-i{background:none;border:none;cursor:pointer;font-size:14px;padding:2px 4px;opacity:.5;transition:opacity .2s}.btn-i:hover{opacity:1}
.inp{width:100%;padding:8px 10px;background:rgba(13,33,55,.8);border:1px solid rgba(0,255,136,.15);border-radius:5px;color:#e0e6ed;font-size:13px;outline:none;font-family:inherit}
.inp:focus{border-color:#00ff88}.inp::placeholder{color:#4a5e75}
textarea.inp{resize:vertical;min-height:50px}
.lbl{display:block;font-size:10px;color:#7a8ba0;letter-spacing:1px;margin-bottom:3px}
.fg{margin-bottom:8px}
.empty{text-align:center;padding:20px;color:#7a8ba0;font-size:12px}
.tabs{display:flex;gap:0;margin-bottom:10px;border-bottom:1px solid rgba(0,255,136,.1)}
.tab{padding:6px 12px;font-size:11px;font-weight:600;color:#7a8ba0;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:#00d4ff}.tab.on{color:#00ff88;border-bottom-color:#00ff88}
.tc{background:#1a2f4a;border:1px solid rgba(0,255,136,.08);border-radius:7px;padding:10px;margin-bottom:6px;transition:border-color .2s}
.tc:hover{border-color:rgba(0,255,136,.2)}
.tc-h{display:flex;align-items:flex-start;justify-content:space-between}
.tc-n{font-size:13px;font-weight:600;margin-bottom:2px}
.tc-br{font-size:11px;color:#00d4ff;margin-bottom:3px}
.tc-m{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#7a8ba0}
.badge{display:inline-flex;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:600}
.b-ok{background:rgba(0,255,136,.12);color:#00ff88;border:1px solid rgba(0,255,136,.2)}
.b-run{background:rgba(0,212,255,.12);color:#00d4ff;border:1px solid rgba(0,212,255,.2)}
.b-pend{background:rgba(255,170,0,.12);color:#ffaa00;border:1px solid rgba(255,170,0,.2)}
.pc{background:#1a2f4a;border:1px solid rgba(0,212,255,.08);border-radius:7px;padding:8px 10px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.pc:hover{border-color:rgba(0,212,255,.2)}
.pc-q{font-size:12px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-br{font-size:10px;color:#00d4ff}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.sc{background:#1a2f4a;border:1px solid rgba(0,255,136,.1);border-radius:8px;padding:12px;border-top:2px solid #00ff88}
.sc-l{font-size:9px;color:#7a8ba0;letter-spacing:1px;margin-bottom:6px}
.sc-v{font-size:22px;font-weight:700;color:#00ff88}
.sc-d{font-size:10px;color:#7a8ba0;margin-top:3px}
.qm{background:#1a2f4a;border:1px solid rgba(0,255,136,.1);border-radius:8px;padding:12px;margin-bottom:14px}
.qm-t{font-size:11px;font-weight:600;color:#7a8ba0;letter-spacing:1px;margin-bottom:8px}
.qm-r{display:flex;gap:6px}
.rc{background:#1a2f4a;border:1px solid rgba(0,255,136,.06);border-radius:8px;padding:12px;margin-bottom:6px}
.rc:hover{border-color:rgba(0,255,136,.2)}
.rc-h{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.rc-q{font-size:13px;font-weight:600}
.rc-a{font-size:11px;color:#7a8ba0;line-height:1.5;padding:8px;background:rgba(10,22,40,.5);border-radius:5px;border-left:2px solid #00d4ff;margin-bottom:8px}
.ra-short{max-height:60px;overflow:hidden;position:relative}
.ra-short::after{content:'...';position:absolute;bottom:0;right:8px;background:linear-gradient(transparent,#1a2f4a 60%);padding-left:20px}
.ra-full{max-height:400px;overflow-y:auto}
.exp{font-size:11px;color:#00d4ff;cursor:pointer;background:none;border:none;padding:0;margin-bottom:6px}.exp:hover{text-decoration:underline}
.mr{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mb{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:10px}
.m-y{background:rgba(0,255,136,.1);color:#00ff88}.m-n{background:rgba(255,68,102,.08);color:#ff4466}
.m-pos{background:rgba(0,255,136,.08);color:#00ff88}.m-neg{background:rgba(255,68,102,.08);color:#ff4466}.m-neu{background:rgba(122,139,160,.1);color:#7a8ba0}
.m-i{background:rgba(0,212,255,.08);color:#00d4ff}
.fc{background:#1a2f4a;border:1px solid rgba(0,255,136,.06);border-radius:7px;padding:10px;margin-bottom:6px}
.fc:hover{border-color:rgba(0,255,136,.2)}
.fc-h{display:flex;align-items:flex-start;justify-content:space-between}
.fc-q{font-size:12px;font-weight:600;margin-bottom:4px}
.fc-a{font-size:11px;color:#7a8ba0;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-f{display:flex;align-items:center;gap:6px;font-size:10px}
.ct{font-size:9px;color:#00d4ff;background:rgba(0,212,255,.1);padding:1px 6px;border-radius:4px;border:1px solid rgba(0,212,255,.2)}
.ov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center}
.md{background:#0d2137;border:1px solid rgba(0,255,136,.2);border-radius:10px;padding:20px;width:400px;max-height:80vh;overflow-y:auto}
.md-t{font-size:14px;font-weight:700;color:#00ff88;letter-spacing:1px;margin-bottom:14px}
.md-a{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
.hid{display:none!important}
.bar-c{display:flex;align-items:flex-end;gap:12px;height:120px;padding:0 8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:200px}
.bar{width:100%;border-radius:4px 4px 0 0;min-height:2px}
.bar-l{font-size:10px;color:#7a8ba0;text-align:center}.bar-v{font-size:11px;font-weight:600;color:#00ff88}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,212,255,.2);border-top-color:#00d4ff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.lm{text-align:center;padding:8px;color:#00d4ff;font-size:12px;cursor:pointer;border:1px dashed rgba(0,212,255,.3);border-radius:6px;margin-top:6px}.lm:hover{background:rgba(0,212,255,.05)}
.bb{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.2);border-radius:6px;padding:8px 10px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.bb span{font-size:12px;color:#00d4ff}
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:200;padding:8px 20px;border-radius:6px;font-size:13px;font-weight:600;transition:opacity .3s;max-width:400px;text-align:center}
.ti{background:rgba(0,212,255,.15);border:1px solid rgba(0,212,255,.3);color:#00d4ff}
.ts{background:rgba(0,255,136,.12);border:1px solid rgba(0,255,136,.3);color:#00ff88}
.te{background:rgba(255,68,102,.12);border:1px solid rgba(255,68,102,.3);color:#ff4466;cursor:pointer}
.th{opacity:0;pointer-events:none}

/* GEO visual refresh: presentation only. Existing markup and handlers remain intact. */
:root{--geo-bg:#0b1220;--geo-panel:#111c2d;--geo-card:#182538;--geo-card-hover:#1d2d43;--geo-line:#2b3d52;--geo-text:#e8eef5;--geo-muted:#a2b2c5;--geo-accent:#38b6c8;--geo-accent-hover:#58c7d5;--geo-success:#61cba2;--geo-warning:#e7b96a;--geo-danger:#f08795}
body{background:var(--geo-bg);color:var(--geo-text);font-family:Inter,'Segoe UI','Microsoft YaHei UI',system-ui,sans-serif;font-size:13px;line-height:1.5}
.bg-p{display:none}
::-webkit-scrollbar-thumb{background:#3a5368}
.nav{height:56px;padding:0 24px;background:#101b2b;border-bottom:1px solid var(--geo-line);box-shadow:0 4px 18px rgba(0,0,0,.12)}
.nav-logo{width:30px;height:30px;border:1px solid rgba(56,182,200,.45);border-radius:9px;background:#193446;color:var(--geo-accent);font-size:16px}
.nav-t{color:var(--geo-text);font-size:15px;letter-spacing:.3px}
.nav-s{color:var(--geo-muted);font-size:11px;letter-spacing:.4px;margin-left:3px}
.nav-r{color:var(--geo-muted);font-size:12px;gap:14px}
.btn-out{border-color:var(--geo-line);border-radius:7px;color:var(--geo-muted);padding:6px 11px}
.btn-out:hover{border-color:var(--geo-danger);background:rgba(240,135,149,.09);color:var(--geo-danger)}
.grid{height:calc(100vh - 56px);background:var(--geo-line);grid-template-columns:240px minmax(0,1fr) 280px}
.col{background:var(--geo-panel);padding:18px 16px}
.col:nth-child(2){background:#0e1929;padding:20px 22px}
.hdr{margin-bottom:13px;padding-bottom:10px;border-bottom:1px solid var(--geo-line)}
.hdr-t,.qm-t{font-size:13px;font-weight:650;color:var(--geo-text);letter-spacing:.2px}
.hdr-b{color:var(--geo-accent);background:rgba(56,182,200,.1);border:1px solid rgba(56,182,200,.22);font-size:11px;padding:2px 8px}
.btn{border-radius:8px;padding:9px 14px;font-size:12px;line-height:1.35;min-height:34px;transition:background .18s,border-color .18s,color .18s,box-shadow .18s}
.btn-s{padding:6px 10px;min-height:30px;font-size:12px}
.btn-g{background:var(--geo-accent);color:#09202b;box-shadow:none}
.btn-g:hover{background:var(--geo-accent-hover);box-shadow:0 4px 14px rgba(56,182,200,.17)}
.btn-b{background:rgba(56,182,200,.1);border:1px solid rgba(56,182,200,.24);color:#8bdce5}
.btn-b:hover{background:rgba(56,182,200,.18)}
.btn-o{background:#19283a;border:1px solid var(--geo-line);color:var(--geo-text)}
.btn-o:hover{background:#22364b;border-color:#4c6d82;color:var(--geo-text)}
.btn-d{background:rgba(240,135,149,.09);border:1px solid rgba(240,135,149,.26);color:var(--geo-danger)}
.btn-d:hover{background:rgba(240,135,149,.17)}
.btn-i{color:var(--geo-muted);opacity:.78;font-size:15px;padding:3px 5px}
.btn-i:hover{color:var(--geo-text);opacity:1}
.inp{background:#0f1c2c;border:1px solid #3a5066;border-radius:8px;color:var(--geo-text);font-size:13px;padding:9px 11px;min-height:36px}
.inp::placeholder{color:#8499ad}
.inp:focus{border-color:var(--geo-accent);box-shadow:0 0 0 3px rgba(56,182,200,.15)}
.lbl{font-size:12px;color:var(--geo-muted);letter-spacing:0;margin-bottom:5px}
.fg{margin-bottom:12px}
.empty{color:var(--geo-muted);font-size:12px;padding:25px 12px}
.tabs{border-bottom:1px solid var(--geo-line);margin-bottom:15px}
.tab{padding:8px 9px;font-size:12px;color:var(--geo-muted);white-space:nowrap}
.tab:hover{color:var(--geo-text)}
.tab.on{color:var(--geo-accent);border-bottom-color:var(--geo-accent)}
.tc,.pc,.rc,.fc,.qm,.sc,.col:nth-child(2)>div[style*="background:#1a2f4a"]{background:var(--geo-card)!important;border:1px solid var(--geo-line)!important;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tc:hover,.pc:hover,.rc:hover,.fc:hover{background:var(--geo-card-hover)!important;border-color:#456178!important}
.tc{padding:13px;margin-bottom:9px}
.tc-n,.rc-q{font-size:13px;color:var(--geo-text);line-height:1.45}
.tc-br,.pc-br{font-size:11px;color:#8bcbd3}
.tc-m{font-size:11px;color:var(--geo-muted);margin-top:6px}
.badge,.mb,.ct{font-size:11px;line-height:1.35;padding:3px 8px;border-radius:999px}
.b-ok,.m-y,.m-pos{background:rgba(97,203,162,.12);color:var(--geo-success);border-color:rgba(97,203,162,.22)}
.b-run,.m-i,.ct{background:rgba(56,182,200,.12);color:#8bdce5;border-color:rgba(56,182,200,.22)}
.b-pend{background:rgba(231,185,106,.12);color:var(--geo-warning);border-color:rgba(231,185,106,.22)}
.m-n,.m-neg{background:rgba(240,135,149,.12);color:var(--geo-danger)}
.m-neu{background:rgba(162,178,197,.12);color:var(--geo-muted)}
.pc{padding:10px 11px;margin-bottom:7px}
.pc-q,.fc-q{font-size:12px;color:var(--geo-text)}
.pc input[type="checkbox"]{accent-color:var(--geo-accent)!important}
.stats{gap:10px;margin-bottom:16px}
.sc{padding:15px 14px;border-top:1px solid var(--geo-line)!important}
.sc-l{font-size:11px;color:var(--geo-muted);letter-spacing:0;margin-bottom:4px}
.sc-v{font-size:25px;font-weight:700;color:var(--geo-text);letter-spacing:-.4px}
.sc-d{font-size:11px;color:var(--geo-muted);margin-top:2px}
.qm{padding:15px;margin-bottom:16px}
.qm-t{margin-bottom:10px}
.qm-r{gap:8px}
.rc{padding:16px;margin-bottom:10px}
.rc-h{margin-bottom:9px}
.rc-a{font-size:12px;line-height:1.65;color:#c0cede;background:#111d2d;border-left-color:var(--geo-accent);padding:11px 12px;margin-bottom:9px}
.ra-short::after{background:linear-gradient(transparent,var(--geo-card) 60%)}
.exp{font-size:12px;color:#8bdce5;margin-bottom:9px}
.mr{gap:6px}
.fc{padding:12px;margin-bottom:9px}
.fc-a{font-size:12px;color:var(--geo-muted);line-height:1.5;margin-bottom:8px}
.fc-f{font-size:11px}
.bar-c{height:130px}
.bar-l{font-size:11px;color:var(--geo-muted)}
.bar-v{font-size:12px;color:var(--geo-text)}
.bar-col:nth-child(1) .bar{background:var(--geo-success)!important}
.bar-col:nth-child(2) .bar{background:var(--geo-danger)!important}
.bar-col:nth-child(3) .bar{background:#728aa3!important}
.ov{background:rgba(4,10,18,.72);backdrop-filter:blur(4px)}
.md{background:#162338;border:1px solid #40566c;border-radius:13px;padding:23px;width:min(420px,calc(100vw - 32px));box-shadow:0 24px 70px rgba(0,0,0,.35)}
.md-t{font-size:16px;color:var(--geo-text);letter-spacing:0;margin-bottom:18px}
.md-a{margin-top:18px}
.lm{font-size:12px;color:#8bdce5;border-color:#426578;padding:10px}
.lm:hover{background:rgba(56,182,200,.08)}
.bb{background:rgba(56,182,200,.1);border-color:rgba(56,182,200,.24);border-radius:8px}
.bb span{color:#8bdce5}
.toast{top:64px;border-radius:8px;padding:10px 16px;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.ti{background:#19374a;border-color:#386b7c;color:#a0e1e8}
.ts{background:#17392f;border-color:#347962;color:#9ce2c3}
.te{background:#432734;border-color:#945160;color:#ffb3bd}
.spin{border-color:rgba(56,182,200,.2);border-top-color:var(--geo-accent)}
.btn:focus-visible,.btn-i:focus-visible,.tab:focus-visible,.exp:focus-visible,.lm:focus-visible,.btn-out:focus-visible{outline:2px solid var(--geo-accent);outline-offset:2px}
@media(max-width:1050px){.grid{grid-template-columns:220px minmax(0,1fr) 250px}.col{padding:14px}.col:nth-child(2){padding:16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:780px){body{overflow:auto;height:auto}.grid{height:auto;min-height:calc(100vh - 56px);grid-template-columns:1fr}.col{overflow:visible}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="bg-p" id="bgp"></div>
<div class="toast th" id="toast"></div>

<div class="nav">
  <div class="nav-l"><div class="nav-logo">&#9671;</div><span class="nav-t">GEO Hub</span><span class="nav-s">&#26234;&#33021;&#24773;&#25253;&#24179;&#21488;</span></div>
  <div class="nav-r"><span id="uLbl">admin</span><button class="btn-out" onclick="doLogout()">&#36864;&#20986;</button></div>
</div>

<div class="grid">
  <!-- LEFT -->
  <div class="col">
    <div class="tabs">
      <div class="tab on" id="tabT" onclick="switchTab('t')">&#30417;&#27979;&#20219;&#21153;</div>
      <div class="tab" id="tabP" onclick="switchTab('p')">Prompt &#24211;</div>
    </div>
    <div id="paneT">
      <button class="btn btn-b btn-s" style="width:100%;margin-bottom:10px" onclick="openTask()">&#43; &#26032;&#24314;&#20219;&#21153;</button>
      <div id="taskList"></div>
    </div>
    <div id="paneP" class="hid">
      <button class="btn btn-b btn-s" style="width:100%;margin-bottom:6px" onclick="openPrompt()">&#43; &#28155;&#21152;Prompt</button>
      <div id="batchBar" class="bb hid"><span>&#24050;&#36873; <b id="selN">0</b> &#26465;</span><div style="display:flex;gap:4px"><button class="btn btn-s btn-o" onclick="clearSel()">&#21462;&#28040;</button><button class="btn btn-s btn-g" id="batchBtn" onclick="doBatch()">&#25209;&#37327;&#30417;&#27979;</button></div></div>
      <div id="promptList"></div>
    </div>
  </div>

  <!-- CENTER -->
  <div class="col">
    <div class="qm">
      <div class="qm-t">&#9889; &#24555;&#36895;&#30417;&#27979;</div>
      <div class="qm-r">
        <input class="inp" id="qInp" placeholder="&#36755;&#20837;&#35201;&#30417;&#27979;&#30340;&#38382;&#39064;..." onkeydown="if(event.key==='Enter')doQuick()">
        <button class="btn btn-g" id="qBtn" onclick="doQuick()">&#36816;&#34892;</button>
        <button class="btn btn-o" onclick="savePrompt()" title="&#20445;&#23384;&#21040;Prompt&#24211;">&#128190;</button>
      </div>

function renderStats(){
  var total=runs.length;
  var men=0,pos=0,neg=0,neu=0,fm=0,sumS=0;
  for(var i=0;i<runs.length;i++){
    var r=runs[i],m=r.metrics||{};

    if(m.sentiment_polarity==='positive'){pos++;sumS+=m.sentiment_score||0;}
    else if(m.sentiment_polarity==='negative'){neg++;sumS+=m.sentiment_score||0;}
    else{neu++;sumS+=m.sentiment_score||0;}
    if(m.faq_matched)fm++;
  }
  var rate=total?Math.round(men/total*100):0;
  var avg=total?(sumS/total).toFixed(2):'0.00';
  document.getElementById('sT').textContent=total;document.getElementById('sTD').textContent='监测实例';
  document.getElementById('sM').textContent=rate+'%';document.getElementById('sMD').textContent=men+'/'+total+' 次提及';

  document.getElementById('sF').textContent=fm+'/'+total;document.getElementById('sFD').textContent=faqs.length+' 条知识库';
  document.getElementById('rCnt').textContent=total;
  var mx=Math.max(pos,neg,neu,1);

function savePrompt(){
  var q=document.getElementById('qInp').value.trim();if(!q){toast('请先输入问题','e');return;}
  apiP('/prompts',{query:q,brand:'星河医院',actor:USER}).then(function(d){prompts.unshift(d);renderPrompts();toast('已保存到Prompt库','s');}).catch(function(){toast('保存失败','e');});
  document.getElementById('qInp').value='';
}

function doLogout(){sessionStorage.clear();location.replace('/login.html');}
function switchTab(t){document.getElementById('tabT').className='tab'+(t==='t'?' on':'');document.getElementById('tabP').className='tab'+(t==='p'?' on':'');document.getElementById('paneT').className=t==='t'?'':'hid';document.getElementById('paneP').className=t==='p'?'':'hid';}
function openM(id){document.getElementById(id).classList.remove('hid');}
function closeM(id){document.getElementById(id).classList.add('hid');}

function reqDel(type,id,label){_pd={type:type,id:id};document.getElementById('cfmMsg').textContent='确定要删除「'+label+'」吗？此操作不可撤销。';openM('mCfm');}
function doCfm(){
  if(!_pd)return;var d=_pd;closeM('mCfm');
  var ep='/'+d.type+'s/'+d.id;
  apiD(ep).then(function(){toast('已删除','s');loadData();}).catch(function(e){toast('删除失败: '+e.message,'e');});
  _pd=null;
}

function openTask(eid){
  document.getElementById('tEid').value=eid||'';
  document.getElementById('mTT').textContent=eid?'编辑任务':'新建监测任务';
  document.getElementById('tDel').style.display=eid?'inline-flex':'none';
  if(eid){var t=null;for(var i=0;i<tasks.length;i++)if(tasks[i].id===eid){t=tasks[i];break;}if(t){document.getElementById('tNm').value=t.name||'';document.getElementById('tBr').value=t.brand||'';document.getElementById('tQ').value=pq(t.queries).join('\n');}}else{document.getElementById('tNm').value='';document.getElementById('tBr').value='';document.getElementById('tQ').value='';}
  openM('mTask');
}

function saveTask(){
  var eid=document.getElementById('tEid').value,nm=document.getElementById('tNm').value.trim(),br=document.getElementById('tBr').value.trim(),qr=document.getElementById('tQ').value.trim();
  if(!nm||!br||!qr){toast('请填写所有字段','e');return;}
  var qs=qr.split('\n');var out=[];for(var i=0;i<qs.length;i++){var s=qs[i].trim();if(s)out.push(s);}
  if(eid){apiU('/tasks/'+eid,{name:nm,brand:br,queries:out}).then(function(){loadData();toast('任务已更新','s');}).catch(function(){toast('更新失败','e');});}
  else{var id='task-'+uid();apiP('/tasks',{id:id,name:nm,brand:br,queries:out,created_by:USER}).then(function(){loadData();toast('任务创建成功','s');}).catch(function(){tasks.unshift({id:id,name:nm,brand:br,queries:JSON.stringify(out),status:'pending',created_by:USER});renderTasks();toast('任务已本地保存','i');});}
  closeM('mTask');
}

function delTask(){var eid=document.getElementById('tEid').value;if(!eid)return;closeM('mTask');var t=null;for(var i=0;i<tasks.length;i++)if(tasks[i].id===eid){t=tasks[i];break;}reqDel('task',eid,t?t.name:eid);}

function runTask(id){
  var t=null;for(var i=0;i<tasks.length;i++)if(tasks[i].id===id){t=tasks[i];break;}if(!t)return;
  t.status='running';renderTasks();toast('正在逐条分析问题...','i');
  apiP('/tasks/'+id+'/run').then(function(r){t.status='completed';loadData();toast('任务完成，共 '+r.total+' 条结果','s');})
  .catch(function(e){
    if(e.message&&e.message.indexOf('404')>=0){
      var qs=pq(t.queries);
      apiP('/tasks',{id:t.id,name:t.name,brand:t.brand,queries:qs,created_by:USER}).then(function(){
        apiP('/tasks/'+id+'/run').then(function(r){t.status='completed';loadData();toast('任务完成，共 '+r.total+' 条结果','s');})
        .catch(function(e2){t.status='pending';renderTasks();toast('运行失败: '+e2.message,'e');});
      }).catch(function(){t.status='pending';renderTasks();toast('创建任务失败','e');});
    }else{t.status='pending';renderTasks();toast('运行失败: '+e.message,'e');}
  });
}

function doQuick(){
  var q=document.getElementById('qInp').value.trim();if(!q)return;
  document.getElementById('qInp').value='';
  var btn=document.getElementById('qBtn');btn.disabled=true;btn.innerHTML='<span class="spin"></span>分析中';
  toast('正在分析: '+q.slice(0,30)+(q.length>30?'...':''),'i');
  apiP('/monitor',{query:q,brand:{name:'星河医院',aliases:[],competitors:[]},run_id:'quick-'+uid()})
  .then(function(r){runs.unshift(r);rv=20;btn.disabled=false;btn.textContent='运行';renderStats();renderRuns();toast('分析完成','s');})
  .catch(function(e){btn.disabled=false;btn.textContent='运行';toast('监测失败: '+e.message,'e');});
}

function openPrompt(){document.getElementById('pQ').value='';openM('mPrompt');}
function savePromptM(){var q=document.getElementById('pQ').value.trim(),br=document.getElementById('pBr').value.trim();if(!q){toast('请填写问题','e');return;}apiP('/prompts',{query:q,brand:br||'星河医院',actor:USER}).then(function(d){prompts.unshift(d);renderPrompts();toast('Prompt 已保存','s');}).catch(function(){toast('保存失败','e');});closeM('mPrompt');}

function openFaq(){document.getElementById('fQ').value='';document.getElementById('fA').value='';openM('mFaq');}
function saveFaq(){var q=document.getElementById('fQ').value.trim(),a=document.getElementById('fA').value.trim(),cat=document.getElementById('fCat').value;if(!q||!a){toast('请填写问题和答案','e');return;}var id='faq-'+uid();apiP('/faqs',{id:id,question:q,answer:a,category:cat,keywords:[],created_by:USER}).then(function(){loadData();toast('FAQ 添加成功','s');}).catch(function(){faqs.unshift({id:id,question:q,answer:a,category:cat,keywords:[],status:'draft',created_by:USER});renderFaqs();toast('FAQ 已本地保存','i');});closeM('mFaq');}
function approveFaq(id){var f=null;for(var i=0;i<faqs.length;i++)if(faqs[i].id===id){f=faqs[i];break;}if(f){f.status='approved';renderFaqs();}apiP('/faqs/'+id+'/approve').then(function(){toast('FAQ 已批准','s');}).catch(function(e){if(f){f.status='draft';renderFaqs();}toast('批准失败: '+e.message,'e');});}

function loadData(){
  Promise.all([apiG('/tasks').catch(function(){return null;}),apiG('/faqs').catch(function(){return null;}),apiG('/runs?limit=200').catch(function(){return null;}),apiG('/prompts').catch(function(){return [];})])
  .then(function(res){
    if(res[0]&&Array.isArray(res[0])&&res[0].length>0)tasks=res[0];
    if(res[1]&&Array.isArray(res[1])&&res[1].length>0)faqs=res[1];
    if(res[2]&&Array.isArray(res[2])&&res[2].length>0){runs=res[2];rv=20;}
    if(res[3]&&Array.isArray(res[3])&&res[3].length>0)prompts=res[3];
    renderAll();
  }).catch(function(){renderAll();});
}

renderAll();
loadData();
</script>
</body>

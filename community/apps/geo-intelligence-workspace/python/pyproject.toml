[project]
name = "xpert-geo-engine"
version = "0.1.0"
description = "Hospital GEO monitoring and governed knowledge analysis for Xpert"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.2,<2",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
  "uvicorn>=0.30,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["geo_engine*"]

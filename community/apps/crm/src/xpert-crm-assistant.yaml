team:
  name: crm-assistant
  type: agent
  title: CRM 助手
  description: 面向客户、联系人、商机、任务和备注的录入、查询、更新与跟进总结的 Xpert 原生 CRM 助手
  avatar:
    emoji:
      id: busts_in_silhouette
    background: rgb(204, 251, 241)
  options:
    templateKey: crm-assistant
    dataXpert:
      managedBy: data-xpert
      templateKey: crm-assistant
      assistantKind: business-assistant
      businessDomain: crm
      requiredPlugin: '@xpert-ai/plugin-crm'
      requiredPlugins:
        - '@xpert-ai/plugin-crm'
      requiredCapabilities:
        - crm-records
        - crm-workbench
        - crm-agent-tools
  agentConfig:
    recursionLimit: 10000
  version: "1"
  agent:
    key: Agent_CrmAssistant
  copilotModel:
    referencedId: null
    modelType: llm
    model: deepseek-flash
    options:
      context_size: 1000000
      temperature: 0.2
      maxRetries: 6
      max_tokens: 65536
      top_p: 1
  knowledgebases: []
  toolsets: []
  tags: []
nodes:
  - type: agent
    key: Agent_CrmAssistant
    position:
      x: 860
      y: 20
    entity:
      key: Agent_CrmAssistant
      name: crm-assistant
      title: CRM 助手
      description: 面向客户、联系人、商机、任务和备注的录入、查询、更新与跟进总结的 Xpert 原生 CRM 助手
      avatar:
        emoji:
          id: busts_in_silhouette
        background: rgb(204, 251, 241)
      prompt: |
        你是 Xpert 原生 CRM 助手，负责辅助用户维护客户、联系人、商机、任务和备注。

        工作规则：
        - 查询 CRM 对象和字段时，优先调用 crm_list_objects。
        - 查询客户、联系人、商机、任务或备注时，调用 crm_search_records。
        - 查看单条记录详情时，调用 crm_get_record。
        - 用户明确要求保存新客户、联系人、商机、任务或备注时，调用 crm_create_record。
        - 用户明确要求修改已有记录时，先确认 recordId，再调用 crm_update_record。
        - 不要编造 CRM 中不存在的 recordId、联系人、公司或商机。
        - 对关键业务判断保持可复核口径：保存和更新后说明对象、记录 id、字段变化和建议用户在 CRM 工作台复核。
        - 不要声称已经完成合同签署、付款、审批或外部系统同步；当前插件只维护 Xpert 原生 CRM 数据。
        - 面向最终用户使用简洁中文回复，除非用户要求其他语言。
      collaboratorNames: []
      toolsetIds: []
      knowledgebaseIds: []
    hash: crm-agent-v1
  - type: workflow
    key: Middleware_Crm
    position:
      x: 1160
      y: 332
    entity:
      type: middleware
      key: Middleware_Crm
      title: CRM Tools
      provider: crm
      required: true
    hash: crm-middleware-v1
connections:
  - type: workflow
    key: Agent_CrmAssistant/Middleware_Crm
    from: Agent_CrmAssistant
    to: Middleware_Crm

team:
  name: img2threejs-modeling-assistant
  type: agent
  title: Image to Three.js Modeling Assistant
  description: Quality-gated procedural Three.js TypeScript modeling from reference images
  options:
    templateKey: img2threejs-modeling-assistant
    dataXpert:
      managedBy: data-xpert
      templateKey: img2threejs-modeling-assistant
      assistantKind: business-assistant
      businessDomain: procedural-3d-modeling
      requiredPlugin: '@xpert-ai/plugin-img2threejs'
      requiredPlugins:
        - '@xpert-ai/plugin-img2threejs'
      requiredCapabilities:
        - img2threejs.procedural-modeling
        - img2threejs.review-workbench
  agentConfig:
    recursionLimit: 160
  version: "1"
  agent:
    key: Agent_Img2ThreeJs
  copilotModel:
    referencedId: null
    modelType: llm
    model: gpt-5
    options:
      temperature: 0.1
      maxRetries: 4
      max_tokens: 12000
  knowledgebases: []
  toolsets: []
  tags: []
nodes:
  - type: agent
    key: Agent_Img2ThreeJs
    position:
      x: 760
      y: 80
    entity:
      key: Agent_Img2ThreeJs
      name: img2threejs-modeling-assistant
      title: Image to Three.js Modeling Assistant
      description: Build reviewable procedural Three.js models through strict evidence and pass gates.
      prompt: >
        Use the installed img2threejs-semantic-modeling Skill for every modeling
        task. Follow its ordered middleware protocol and quality gates. Generate
        procedural Three.js in TypeScript only and never introduce Python. Treat
        host-provided project context as authoritative. Do not claim success
        without persisted tool results. Finish all read-only context calls first,
        then call read_evidence for every admitted image at the exact current
        revision immediately before update_spec; the mutation rejects missing or
        stale evidence inspection. Treat imageAttachmentAvailable as byte
        availability only; if the active model profile does not explicitly
        support image inputs, choose request-input. After validating the Sculpt Spec, enqueue
        blockout once and bounded-long-poll the Managed Queue chain; do not spend
        one Agent tool call per deterministic stage. If the Skill is unavailable
        or admitted image pixels cannot be grounded, choose request-input.
      promptTemplates: null
      parameters: null
      outputVariables: null
      options: null
      copilotModel:
        referencedId: null
        modelType: llm
        model: gpt-5
        options:
          temperature: 0.1
          maxRetries: 4
          max_tokens: 12000
      leaderKey: null
      collaboratorNames: []
      toolsetIds: []
      knowledgebaseIds: []
    hash: img2threejs-agent-v7
  - type: workflow
    key: Middleware_Img2ThreeJs
    position:
      x: 540
      y: 340
    entity:
      id: Middleware_Img2ThreeJs
      type: middleware
      key: Middleware_Img2ThreeJs
      title: Image to Three.js Agent Tools
      provider: img2threejs.agent-tools
      required: true
    hash: img2threejs-middleware-v2
connections:
  - type: workflow
    key: Agent_Img2ThreeJs/Middleware_Img2ThreeJs
    from: Agent_Img2ThreeJs
    to: Middleware_Img2ThreeJs

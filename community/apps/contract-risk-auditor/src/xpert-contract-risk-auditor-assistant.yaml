  name: contract-risk-auditor-assistant
  type: agent
  title: 合同风险排查助手
  description: 面向采购合同风险条款审查、霸王条款排查、权利义务对等性核验及防违约修订建议的业务助手
  avatar:
    emoji:
      id: shield
    background: rgb(224, 231, 255)
  options:
    templateKey: contract-risk-auditor-assistant
    dataXpert:
      managedBy: data-xpert
      templateKey: contract-risk-auditor-assistant
      assistantKind: business-assistant
      businessDomain: contract-risk-auditor
      requiredPlugin: '@community/apps-contract-risk-auditor'
      requiredPlugins:
        - '@community/apps-contract-risk-auditor'
      requiredCapabilities:
        - contract_risk_auditor
        - contract-risk-workbench
  agentConfig:
    stateVariables:
      - name: currentRecordId
        type: string
        default: ""

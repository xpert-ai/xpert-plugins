team:
  name: factory-operations-autopilot
  type: agent
  title: 工厂异常恢复编排助手
  description: 通过必需的 External Xpert 直连编排独立角色 Assistants，推进异常研判、审批、受控执行与恢复验证。
  avatar:
    emoji:
      id: factory
      unified: 1f3ed
    background: rgb(231, 248, 241)
  options:
    templateKey: factory-operations-autopilot
    workspaceScope:
      mode: project-required
      projectType:
        applicationKey: "@xpert-ai/plugin-factory-operations:factory-operations"
        projectTypeKey: case
    workbench:
      initialLayout: workbench-maximized
      defaultViewKey: factory_ops__factory-case-workspace
    dataXpert:
      managedBy: data-xpert
      templateKey: factory-operations-autopilot
      assistantKind: business-assistant
      businessDomain: factory-operations
      assistantTopology: independent-assistants
      requiredPlugin: '@xpert-ai/plugin-factory-operations'
      requiredPlugins:
        - '@xpert-ai/plugin-factory-operations'
      requiredCapabilities:
        - factory-case-coordination
        - factory-recovery-execution
        - factory-operations-workbench
    agent:
      Agent_FactoryCoordinator: { position: { x: 420, y: 40 } }
  agentConfig:
    recursionLimit: 120
    maxConcurrency: 8
    timeout: 600000
    stateVariables: []
    mute: []
  memory:
    enabled: false
  summarize:
    enabled: true
    maxMessages: 40
    retainMessages: 12
  features:
    opener:
      enabled: true
      message: ''
      questions:
        - 请读取当前 M-07 严重异常的证据，并说明项目流水线的启动条件。
        - 请读取这个工厂事件的最新进度，说明阻塞项和下一步。
        - 方案 B 已经批准，请查看项目流水线的执行确认和恢复验证结果。
    suggestion:
      enabled: true
      prompt: 基于当前 Factory Case 的服务端投影，建议不超过三个可执行或需要人工决策的问题。
    attachment:
      enabled: false
    memoryReply:
      enabled: false
    sandbox:
      enabled: false
    title:
      enabled: true
      instruction: 生成包含 Factory Case、设备或恢复阶段的简短标题。
  version: '6'
  agent:
    key: Agent_FactoryCoordinator
  copilotModel:
    referencedId: null
    modelType: llm
    model: qwen3.6-plus
    options:
      context_size: 256000
      temperature: 0.1
      maxRetries: 3
      max_tokens: 8192
  knowledgebases: []
  toolsets: []
  tags: []
nodes:
  - type: agent
    key: Agent_FactoryCoordinator
    position: { x: 420, y: 40 }
    entity:
      key: Agent_FactoryCoordinator
      name: factory-operations-coordinator
      title: 工厂异常恢复编排 Agent
      description: 读取持久化 Case、解释证据和阻塞；项目流水线负责派发独立角色 Assistants。
      prompt: |
        You are the Factory Operations Coordinator. Read the persisted Case and
        explain its evidence, current business status and pending human decision.
        The platform Project pipeline owns the DAG, specialist dispatch, retries,
        cancellation, rounds and execution records. Do not call External Assistants
        or choose/advance the next node yourself. Direct the user to Start Project
        Pipeline in the Case workbench and to the Project pipeline for recovery.
        Role Assistants submit only the platform-assigned operation and are accepted
        only through their scoped business finalizers. Human approval remains bound
        to the exact plan revision. Never approve, reject, execute recovery actions,
        or fabricate a confirmation. Distinguish simulation receipts from real
        external-system confirmations; cite the Case revision and source evidence.
      promptTemplates: null
      parameters: null
      outputVariables: null
      options:
        parallelToolCalls: true
        middlewares:
          order:
            - Middleware_FactoryCoordination
            - Middleware_FactoryExecution
      copilotModel: null
      leaderKey: null
      collaboratorNames: []
      toolsetIds: []
      knowledgebaseIds: []
    hash: factory-operations-coordinator-v4
  - type: workflow
    key: Middleware_FactoryCoordination
    position: { x: 300, y: 360 }
    entity:
      type: middleware
      key: Middleware_FactoryCoordination
      title: Factory Case read tools
      provider: FactoryCaseCoordinationMiddleware
      required: true
    hash: factory-coordination-middleware-v1
  - type: workflow
    key: Middleware_FactoryExecution
    position: { x: 540, y: 360 }
    entity:
      type: middleware
      key: Middleware_FactoryExecution
      title: Recovery execution status
      provider: FactoryRecoveryExecutionMiddleware
      required: true
    hash: factory-execution-middleware-v1
connections:
  - type: workflow
    key: Agent_FactoryCoordinator/Middleware_FactoryCoordination
    from: Agent_FactoryCoordinator
    to: Middleware_FactoryCoordination
    required: true
  - type: workflow
    key: Agent_FactoryCoordinator/Middleware_FactoryExecution
    from: Agent_FactoryCoordinator
    to: Middleware_FactoryExecution
    required: true

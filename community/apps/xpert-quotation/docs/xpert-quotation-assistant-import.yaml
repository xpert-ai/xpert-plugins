# Import this DSL into the existing Xpert报价助手.
# It is scoped to the current organization and references its two existing knowledgebases.
team:
  name: xpert-quotation-assistant
  type: agent
  title: Xpert报价助手
  description: 识别 Xpert 报价工作簿，逐行检索定额和人材机价格，并输出可审核的报价提案。
  avatar:
    emoji:
      id: calculator
    background: rgb(220, 252, 231)
  options:
    templateKey: xpert-quotation-assistant
    dataXpert:
      managedBy: data-xpert
      templateKey: xpert-quotation-assistant
      assistantKind: business-assistant
      businessDomain: xpert-quotation
      requiredPlugin: "@xpert-ai/plugin-xpert-quotation"
      requiredPlugins:
        - "@xpert-ai/plugin-xpert-quotation"
        - "@xpert-ai/plugin-web-tools"
      requiredCapabilities:
        - xpert-quotation
        - xpert-quotation-workbench
        - faithful-xlsx-patch
  agentConfig:
    recursionLimit: 10000
  features:
    sandbox:
      enabled: true
      provider: local-shell-sandbox
  version: "20"
  agent:
    key: Agent_XpertQuotation
  copilotModel:
    referencedId: null
    modelType: llm
    model: qwen3.6-plus
    options:
      context_size: 1000000
      temperature: 0.1
      maxRetries: 4
      max_tokens: 8192
      enable_search: true
  knowledgebases: []
  toolsets: []
  tags: []

nodes:
  - type: agent
    key: Agent_XpertQuotation
    position:
      x: 760
      y: 40
    entity:
      key: Agent_XpertQuotation
      name: xpert-quotation-assistant
      title: Xpert报价助手
      description: 负责工作簿识别、逐行任务分派和审核结果汇总。
      prompt: >-
        You are the Xpert Quotation coordinator. The main Agent owns only
        Workbench context, workbook inspection, recognition, matching, issue
        pagination, task dispatch, and final status reporting. Always call
        xpert_quotation_inspect_workbook before matching and use only exact sheet,
        cell, row, column, and subtotal evidence returned by the tool.

        When the user asks about the current Workbench file or view, first call
        xpert_quotation_get_current_workbench_context. It returns metadata and a
        file path only, never workbook cells or file contents. Use parsed_file_*
        or sandbox file tools on demand and use the quotation inspection tool for
        authoritative XLSX structure.

        After xpert_quotation_start_matching, page
        xpert_quotation_list_issues until hasNext=false. Send every unresolved
        kind=bill or kind=material row to the xpert-quotation-line-worker follower
        with exactly one compact JSON object containing quotationId, lineId, kind,
        lineNumber, billCode, billName, specification, unit, quantity, and
        discipline copied from the persisted issue. Launch at most two Workers at
        once and keep only compact summaries.

        A Workbench resource button may send mode=resource_price or
        mode=resource_consumption with quotationId, lineId, and one exact resource
        object. Treat it as a targeted retry: forward only that line and resource
        to the line Worker. The price button must reach the price Agent and the
        consumption button must reach the consumption Agent. Do not re-run the
        whole workbook, call retrieval tools from this coordinator, calculate, or
        write Excel. Persisted candidates are shown below the originating button
        after the Workbench refreshes.

        The Worker dispatches kind=bill rows to the
        xpert-quotation-consumption-agent, which is connected only to the
        消耗量定额库, and then dispatches each returned resource to the
        xpert-quotation-price-agent, which is connected only to the价格库. It
        dispatches kind=material rows directly to the price Agent. Never send a
        quota task to the price Agent or a price task to the consumption Agent.

        AI quota and price results are proposed evidence only. Do not review,
        calculate, apply, or write Excel during automatic recognition. Those
        actions require explicit human confirmation in the review Workbench.
        Re-read persisted issues at the end and report proposed, unmatched, and
        human-review-required items without inventing IDs, prices, units, or
        source evidence.
      promptTemplates: null
      parameters: null
      outputVariables: null
      options:
        fileUnderstanding:
          enabled: true
        middlewares:
          order:
            - Middleware_XpertQuotationCoordinator
      copilotModel: null
      leaderKey: null
      collaboratorNames: []
      toolsetIds: []
      knowledgebaseIds: []

  - type: agent
    key: Agent_XpertQuotationLineWorker
    position:
      x: 360
      y: 320
    entity:
      key: Agent_XpertQuotationLineWorker
      leaderKey: Agent_XpertQuotation
      name: xpert-quotation-line-worker
      title: 逐行定额检索 Worker
      description: 独立处理一条工程清单，持久化定额组成和人材机价格候选。
      prompt: >-
        You are the stateless line quotation orchestrator. Receive exactly one
        compact JSON object containing quotationId, lineId, kind, lineNumber,
        billCode, billName, specification, unit, quantity, and discipline. A
        targeted Workbench retry may also include mode=resource_price or
        mode=resource_consumption and one exact resource object. Reject missing
        IDs, multiple rows, or facts not copied from the parent.

        HARD RUNTIME BOUNDARY: this Worker has no knowledgebase connection and is
        not a retrieval Agent. Never call quota, resource-price, material-price,
        web-search, or web-fetch tools directly. Delegate retrieval only to the
        two follower Agents connected below. If a follower is unavailable, return
        blocked instead of bypassing it with a direct tool call.

        For kind=bill, delegate to the xpert-quotation-consumption-agent follower
        and wait for its result. That Agent alone calls
        xpert_quotation_search_quota_components against the
        connected 消耗量定额库 and returns at most five candidates with the latest
        searchSnapshotId, workScopes, evidence, and 人材机 unit consumption. Use
        only those current candidate IDs, then call
        xpert_quotation_propose_quota_breakdown. This tool only persists the quota
        mapping and returns resourcePricing.resources; it never searches prices.
        Partition all exact workScopes between covered and uncovered once. If the
        child is blocked or has no defensible candidate, persist components=[]
        and all returned workScopes as uncoveredWorkScopes.

        For mode=resource_consumption, still delegate to the consumption Agent
        with the exact resourceId, category, code, name, aliases, unit, quotaUnit,
        and current consumption. Persist the refreshed quota proposal so the
        Workbench can display at most five matching candidates below that
        resource's button. For mode=resource_price, delegate only the requested
        resource (or the bounded resources list) to the price Agent. Never
        calculate or write Excel in either targeted mode.

        Send each returned resource sequentially to the
        xpert-quotation-price-agent follower. That Agent alone searches and
        recommends resource prices from the connected 价格库. For kind=material,
        send the row directly to that price Agent for material price search or
        no-match/web fallback. Never send quota work to the price Agent.

        Evidence collection only: never retrieve directly, review, calculate,
        apply a patch, write Excel, or process another row. Return a compact
        status with lineId,
        quotaCandidateCount, quotaBreakdownStatus, resourceCount,
        resourcePriceSearchCount, uncoveredWorkScopes, and nextAction.
      promptTemplates: null
      parameters: null
      outputVariables: null
      options:
        disableMessageHistory: true
        middlewares:
          order:
            - Middleware_XpertQuotationLineWorker
      copilotModel: null
      collaboratorNames: []
      toolsetIds: []
      knowledgebaseIds: []

  - type: agent
    key: Agent_XpertQuotationConsumptionRetriever
    position:
      x: 220
      y: 320
    entity:
      key: Agent_XpertQuotationConsumptionRetriever
      leaderKey: Agent_XpertQuotationLineWorker
      name: xpert-quotation-consumption-agent
      title: 消耗量检索 Agent
      description: 只检索消耗量定额和人材机单位消耗量。
      prompt: >-
        You are the stateless consumption-quota retrieval Agent. Receive one
        kind=bill row and call xpert_quotation_search_quota_components only. A
        targeted request may include mode=resource_consumption and one resource
        object; use it to rank candidates for that exact resource. Search only
        this Agent's connected 消耗量定额库. Return at most five
        current candidates with exact candidateId, searchSnapshotId, workScopes,
        quota code/name/unit, source evidence, and 人材机 unit consumption. Never
        call a price tool, never propose a breakdown, and never process another
        row. Return a compact summary to the parent Worker.
      options:
        disableMessageHistory: true
      collaboratorNames: []
      toolsetIds: []
      knowledgebaseIds: []

  - type: agent
    key: Agent_XpertQuotationPriceRetriever
    position:
      x: 820
      y: 320
    entity:
      key: Agent_XpertQuotationPriceRetriever
      leaderKey: Agent_XpertQuotationLineWorker
      name: xpert-quotation-price-agent
      title: 价格检索 Agent
      description: 只检索人工、材料和机械资源价格。
      prompt: >-
        You are the stateless price retrieval Agent. Receive one resource task or
        one kind=material row and use only the connected 价格库. For resource
        tasks, including mode=resource_price, call
        xpert_quotation_search_resource_prices and keep at most five candidates;
        when a current candidate is valid, call
        xpert_quotation_recommend_resource_price. Search with resource category,
        code, name, aliases, and unit; never use the bill m2/m3 unit. For material
        tasks use the knowledge-price search/recommend/no-match tools, then web
        fallback only after a successful no-match. Never call quota search or
        quota proposal, never review, calculate, or write Excel, and return a
        compact status only.
      options:
        disableMessageHistory: true
      collaboratorNames: []
      toolsetIds: []
      knowledgebaseIds: []

  - type: workflow
    key: Middleware_XpertQuotationCoordinator
    position:
      x: 760
      y: 500
    entity:
      type: middleware
      key: Middleware_XpertQuotationCoordinator
      title: Xpert Quotation Coordinator Tools
      provider: XpertQuotationMiddleware
      required: true
      tools:
        xpert_quotation_get_current_workbench_context: true
        xpert_quotation_get_summary: true
        xpert_quotation_inspect_workbook: true
        xpert_quotation_start_matching: true
        xpert_quotation_list_issues: true
        xpert_quotation_search_quota_components: false
        xpert_quotation_propose_quota_breakdown: false
        xpert_quotation_review_quota_breakdown: true
        xpert_quotation_search_resource_prices: false
        xpert_quotation_recommend_resource_price: false
        xpert_quotation_review_resource_price: true
        xpert_quotation_calculate_comprehensive_rate: true
        xpert_quotation_search_knowledge_prices: false
        xpert_quotation_recommend_knowledge_price: false
        xpert_quotation_mark_knowledge_no_match: false
        xpert_quotation_recommend_web_price: false
        xpert_quotation_apply_patch: true

  - type: workflow
    key: Middleware_WebTools
    position:
      x: 1040
      y: 500
    entity:
      type: middleware
      key: Middleware_WebTools
      title: Web Tools
      provider: WebTools
      required: true

  - type: workflow
    key: Middleware_XpertQuotationLineWorker
    position:
      x: 360
      y: 680
    entity:
      type: middleware
      key: Middleware_XpertQuotationLineWorker
      title: Xpert Quotation Line Tools
      provider: XpertQuotationMiddleware
      required: true
      tools:
        xpert_quotation_get_summary: false
        xpert_quotation_inspect_workbook: false
        xpert_quotation_start_matching: false
        xpert_quotation_list_issues: false
        xpert_quotation_search_quota_components: false
        xpert_quotation_propose_quota_breakdown: true
        xpert_quotation_review_quota_breakdown: false
        xpert_quotation_search_resource_prices: false
        xpert_quotation_recommend_resource_price: false
        xpert_quotation_review_resource_price: false
        xpert_quotation_calculate_comprehensive_rate: false
        xpert_quotation_search_knowledge_prices: false
        xpert_quotation_recommend_knowledge_price: false
        xpert_quotation_mark_knowledge_no_match: false
        xpert_quotation_recommend_web_price: false
        xpert_quotation_apply_patch: false

  - type: workflow
    key: Middleware_XpertQuotationConsumption
    position:
      x: 220
      y: 680
    entity:
      type: middleware
      key: Middleware_XpertQuotationConsumption
      title: Consumption Quota Retrieval Tools
      provider: XpertQuotationMiddleware
      required: true
      tools:
        xpert_quotation_search_quota_components: true
        xpert_quotation_propose_quota_breakdown: false
        xpert_quotation_search_resource_prices: false
        xpert_quotation_recommend_resource_price: false
        xpert_quotation_search_knowledge_prices: false
        xpert_quotation_recommend_knowledge_price: false
        xpert_quotation_mark_knowledge_no_match: false
        xpert_quotation_recommend_web_price: false
        xpert_quotation_apply_patch: false

  - type: workflow
    key: Middleware_XpertQuotationPrice
    position:
      x: 820
      y: 680
    entity:
      type: middleware
      key: Middleware_XpertQuotationPrice
      title: Resource and Material Price Retrieval Tools
      provider: XpertQuotationMiddleware
      required: true
      tools:
        xpert_quotation_search_quota_components: false
        xpert_quotation_propose_quota_breakdown: false
        xpert_quotation_search_resource_prices: true
        xpert_quotation_recommend_resource_price: true
        xpert_quotation_search_knowledge_prices: true
        xpert_quotation_recommend_knowledge_price: true
        xpert_quotation_mark_knowledge_no_match: true
        xpert_quotation_recommend_web_price: true
        xpert_quotation_apply_patch: false


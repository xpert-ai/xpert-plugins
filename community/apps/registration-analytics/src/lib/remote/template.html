<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>报名问数台</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --border: #e4e7ec;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #0e7490;
      --primary-soft: #ecfeff;
      --danger: #dc2626;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    .shell { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .header { display: flex; align-items: center; gap: 10px; }
    .header .mark {
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--primary); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700;
    }
    .header .title { font-size: 16px; font-weight: 600; }
    .header .sub { color: var(--muted); font-size: 12px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 14px;
    }
    .card .num { font-size: 22px; font-weight: 700; }
    .card .label { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .card .chip { display: inline-block; margin-right: 6px; margin-top: 6px; padding: 2px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 12px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .panel-head { padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
    .panel-head .actions { display: flex; gap: 8px; align-items: center; }
    .hint { color: var(--muted); font-size: 12px; }
    .search-input {
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; width: 180px; outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 14px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); background: #fafbfc; white-space: nowrap; }
    td { padding: 8px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .badge.confirmed { background: #ecfdf5; color: #059669; }
    .badge.pending { background: #fffbeb; color: #d97706; }
    .badge.cancelled { background: #fef2f2; color: #dc2626; }
    .empty { padding: 24px; text-align: center; color: var(--muted); }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
    .suggestion {
      border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
      padding: 5px 12px; font-size: 12px; color: var(--primary); cursor: pointer;
    }
    .suggestion:hover { border-color: var(--primary); background: var(--primary-soft); }
    .saved-list { display: flex; flex-direction: column; }
    .saved-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--border); }
    .saved-item:last-child { border-bottom: none; }
    .saved-item .q-name { font-weight: 600; }
    .saved-item .q-text { color: var(--muted); font-size: 12px; }
    .saved-item .q-empty { color: var(--muted); font-size: 12px; padding: 8px 14px; }
    button {
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.danger { color: var(--danger); }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .notice { padding: 8px 14px; font-size: 12px; }
    .notice.error { background: #fef2f2; color: var(--danger); }
    .notice.success { background: #ecfdf5; color: #059669; }
    .loading { padding: 24px; text-align: center; color: var(--muted); }
    .footer-note { color: var(--muted); font-size: 12px; text-align: center; padding: 4px 0 12px; }
  </style>
</head>
<body>
  <div id="root" class="shell">
    <div class="loading">加载中…</div>
  </div>
  <!--APP_SCRIPT-->
</body>
</html>

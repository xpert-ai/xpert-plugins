team:
  name: scrape-task-intake-assistant
  type: agent
  title: 采集需求受理助手
  description: 面向自然语言采集需求受理、任务书生成、审核补充与状态跟踪的业务助手
  avatar:
    emoji:
      id: search-eye
    background: rgb(204, 251, 241)
  options:
    templateKey: scrape-task-intake-assistant
    dataXpert:
      managedBy: data-xpert
      templateKey: scrape-task-intake-assistant
      assistantKind: business-assistant
      businessDomain: scrape-task-intake
      requiredPlugin: '@xpert-ai/plugin-scrape-task-intake'
      requiredPlugins:
        - '@xpert-ai/plugin-scrape-task-intake'
      requiredCapabilities:
        - scrape_task_intake
        - scrape-request-entry
        - scrape-task-review-desk
  agentConfig:
    stateVariables:
      - name: currentTaskId
        type: string
        default: ""
        description: Current scrape task id selected in the workbench
        operation: null
    recursionLimit: 10000
  version: "1"
  agent:
    key: Agent_ScrapeTaskIntake
  copilotModel:
    referencedId: null
    modelType: llm
    model: deepseek-v4-flash-0731
    options:
      context_size: 65536
      temperature: 0.2
      maxRetries: 6
      max_tokens: 8192
      top_p: 0.95
  knowledgebases: []
  toolsets: []
  tags: []
nodes:
  - type: agent
    key: Agent_ScrapeTaskIntake
    position:
      x: 860
      y: 20
    entity:
      key: Agent_ScrapeTaskIntake
      name: scrape-task-intake-assistant
      title: 采集需求受理助手
      description: 面向自然语言采集需求受理、任务书生成、审核补充与状态跟踪的业务助手
      avatar:
        emoji:
          id: search-eye
        background: rgb(204, 251, 241)
      prompt: >
        You are Scrape Task Intake, a data-xpert business assistant for
        AI-assisted scraping request intake. You turn natural-language
        collection requests into reviewable, structured scraping task specs.

        Treat every scraping request as reviewable business data. When the
        user clearly describes a collection need (target site, fields,
        frequency, delivery format), extract one structured task spec and
        call scrape_intake_save_generated_task exactly once for that request.
        Do not split one request into multiple tasks.

        Never invent target URLs, credentials, or field names the user did
        not provide or that are not covered by scrape_intake_get_catalog
        templates. Put missing or uncertain information in completenessTips.
        Keep antiBotNotes and complianceNotes as engineering cautions only:
        describe expected captcha, rate limits, TLS/JS fingerprint checks,
        robots.txt/ToS or personal-data concerns, but never claim any
        protection was bypassed or that data use is already authorized.

        Core workflows:
        1. For site type and field normalization, call scrape_intake_get_catalog
           before choosing dataFields, crawlFrequency, deliveryFormat or
           pagesScope when candidates are needed.
        2. When the user describes a collection request, call
           scrape_intake_save_generated_task once with the structured spec.
        3. For task search questions, call scrape_intake_search_tasks.
        4. For detail questions about a known task, call
           scrape_intake_get_task_detail with the exact taskId.
        5. When the user supplements a needs-supplement task, call
           scrape_intake_prepare_supplement_draft with the exact taskId and
           the supplement fields, then tell the user to open the Scrape Task
           Intake review desk, one-click fill the draft, and save manually.

        Do not promise that collection has started, data was delivered, or
        the task is closed. Confirm task, start collection, mark completed,
        and reject-and-close are human review actions in the workbench, not
        Assistant-side decisions. Prefer concise Chinese responses for end
        users unless they ask otherwise.
      collaboratorNames: []
      toolsetIds: []
      knowledgebaseIds: []
    hash: scrape-task-intake-agent-v2
  - type: workflow
    key: Middleware_ScrapeTaskIntake
    position:
      x: 1160
      y: 332
    entity:
      type: middleware
      key: Middleware_ScrapeTaskIntake
      title: Scrape Task Intake Tools
      provider: ScrapeTaskIntakeMiddleware
      required: true
    hash: scrape-task-intake-middleware-v1
connections:
  - type: workflow
    key: Agent_ScrapeTaskIntake/Middleware_ScrapeTaskIntake
    from: Agent_ScrapeTaskIntake
    to: Middleware_ScrapeTaskIntake

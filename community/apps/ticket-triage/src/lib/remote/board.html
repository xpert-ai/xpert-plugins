<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工单分诊板 · Ticket triage board</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #16181d;
    --muted: #5b6270;
    --line: #e2e5ea;
    --accent: #1f6feb;
    --pending: #8b8f98;
    --proposed: #b5811a;
    --confirmed: #1c8a4b;
    --failed: #b5342c;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.55 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  .version-badge {
    font-size: 11px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 8px;
  }
  .spacer { flex: 1; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); padding: 6px 12px; transition: background .12s ease, border-color .12s ease;
  }
  button:hover:not(:disabled) { background: #eef1f6; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #1a5fca; }
  button.ghost { background: transparent; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0; height: calc(100vh - 57px); }
  .list-pane { overflow: auto; padding: 16px 18px; }
  .detail-pane { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 16px 18px; }
  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    font-size: 12px; color: var(--muted); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
  }
  .chip b { color: var(--ink); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); background: #fbfcfd; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f9fafc; }
  tbody tr.selected { background: #eef4ff; }
  .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
  .badge { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .badge.pending { color: var(--pending); }
  .badge.proposed { color: var(--proposed); }
  .badge.confirmed { color: var(--confirmed); }
  .badge.failed { color: var(--failed); }
  .badge.priority { color: var(--muted); font-family: ui-monospace, monospace; }
  .muted { color: var(--muted); }
  .empty { padding: 40px 8px; text-align: center; color: var(--muted); }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .detail-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .detail-head strong { font-size: 15px; }
  .field { margin: 14px 0; }
  .field dt { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .field dd { margin: 0; white-space: pre-wrap; }
  .rationale { background: #fbfcfd; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .actions .reject { color: var(--failed); border-color: #e8c9c6; }
  .toast {
    position: fixed; right: 18px; bottom: 18px; max-width: 360px;
    background: #16181d; color: #fff; padding: 10px 14px; border-radius: var(--radius);
    font-size: 13px; opacity: 0; transform: translateY(6px); transition: opacity .16s ease, transform .16s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--failed); }
  #ticket-triage-loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--bg); color: var(--muted); font-size: 13px;
  }
</style>
</head>
<body>
  <div id="ticket-triage-loading" role="status">正在连接 Xpert 工作台… / Connecting to the workspace…</div>
  <header>
    <h1>工单分诊板 <span class="muted">/ Ticket triage board</span></h1>
    <span class="version-badge">0.0.0</span>
    <span class="spacer"></span>
    <button id="btn-seed" class="ghost" type="button">载入演示工单</button>
    <button id="btn-refresh" type="button">刷新</button>
  </header>
  <main>
    <section class="list-pane" aria-live="polite">
      <div class="summary" id="summary"></div>
      <div id="list"></div>
    </section>
    <aside class="detail-pane" id="detail"></aside>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="./entry.js"></script>
</body>
</html>

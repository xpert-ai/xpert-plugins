<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <rect width="1000" height="620" fill="#0f172a" rx="8"/>
  <!-- Top Navigation -->
  <rect x="20" y="20" width="960" height="50" fill="#1e293b" stroke="#334155" rx="6"/>
  <text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">🎨 Xpert 助手画布编排视图 (Canvas Graph: smart-ticket-assistant)</text>

  <!-- Canvas Grid Background -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4">
    <line x1="20" y1="120" x2="680" y2="120" />
    <line x1="20" y1="180" x2="680" y2="180" />
    <line x1="20" y1="240" x2="680" y2="240" />
    <line x1="20" y1="300" x2="680" y2="300" />
    <line x1="20" y1="360" x2="680" y2="360" />
    <line x1="20" y1="420" x2="680" y2="420" />
    <line x1="20" y1="480" x2="680" y2="480" />
    <line x1="20" y1="540" x2="680" y2="540" />
  </g>

  <!-- Node 1: Agent_SmartTicket -->
  <rect x="70" y="220" width="220" height="150" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <rect x="70" y="220" width="220" height="35" fill="#2563eb" rx="8"/>
  <text x="85" y="243" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">🤖 Agent: Agent_SmartTicket</text>
  <text x="85" y="275" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">名称: 智能客诉工单助手</text>
  <text x="85" y="298" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">角色: 客服专家 / 运营支持</text>
  <text x="85" y="321" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">模型: 平台主模型 (Primary)</text>
  <text x="85" y="344" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#38bdf8">Recursion Limit: 24</text>

  <!-- Connection Line & Arrow -->
  <line x1="290" y1="295" x2="430" y2="295" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,3"/>
  <polygon points="430,290 442,295 430,300" fill="#38bdf8"/>
  <text x="320" y="285" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#38bdf8">tools / view</text>

  <!-- Node 2: Middleware_SmartTicket -->
  <rect x="440" y="220" width="230" height="150" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <rect x="440" y="220" width="230" height="35" fill="#059669" rx="8"/>
  <text x="455" y="243" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">🧩 Middleware: SmartTicket</text>
  <text x="455" y="275" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">Provider: SmartTicketMiddleware</text>
  <text x="455" y="298" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">绑定视图: smart-ticket.workbench</text>
  <text x="455" y="321" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">挂载插槽: agent.workbench.fixed</text>
  <text x="455" y="344" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#34d399">✓ Required: true</text>

  <!-- Right Inspector Panel -->
  <rect x="700" y="90" width="280" height="510" fill="#1e293b" stroke="#334155" rx="6"/>
  <text x="720" y="125" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">⚙️ 节点属性配置检查器</text>
  
  <text x="720" y="160" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">中间件挂载工具列表 (Tools):</text>
  <rect x="720" y="170" width="240" height="95" fill="#0f172a" stroke="#334155" rx="4"/>
  <text x="730" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#38bdf8">1. ticket_analyze_and_draft</text>
  <text x="730" y="220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#38bdf8">2. ticket_confirm_and_save</text>
  <text x="730" y="245" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#38bdf8">3. ticket_list_records</text>

  <text x="720" y="295" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">工作台扩展接入 (View Extension):</text>
  <rect x="720" y="305" width="240" height="95" fill="#0f172a" stroke="#334155" rx="4"/>
  <text x="730" y="330" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#34d399">• Provider: TicketViewProvider</text>
  <text x="730" y="355" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#34d399">• Entry: smart_ticket__remote</text>
  <text x="730" y="380" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#34d399">• 隔离类型: iframe (Remote Component)</text>

  <text x="720" y="430" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">实体数据源 (TypeORM):</text>
  <rect x="720" y="440" width="240" height="60" fill="#0f172a" stroke="#334155" rx="4"/>
  <text x="730" y="465" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#f8fafc">Table: plugin_smart_ticket_record</text>
  <text x="730" y="485" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Scope: Tenant / Org / Workspace</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <rect width="1000" height="620" fill="#f8fafc" rx="8"/>
  <!-- Header Bar -->
  <rect x="20" y="20" width="960" height="60" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <text x="40" y="56" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">🎧 智能客诉工单工作台 (Smart Ticket Agentic App)</text>
  <rect x="680" y="35" width="80" height="28" fill="#fee2e2" stroke="#fecaca" rx="14"/>
  <text x="695" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">P0 紧急: 1</text>
  <rect x="775" y="35" width="80" height="28" fill="#e0f2fe" stroke="#bae6fd" rx="14"/>
  <text x="790" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">待审核: 2</text>
  <rect x="870" y="35" width="80" height="28" fill="#dcfce7" stroke="#bbf7d0" rx="14"/>
  <text x="885" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">已归档: 5</text>

  <!-- Input Area -->
  <rect x="20" y="95" width="960" height="110" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <text x="35" y="120" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#334155">📥 客诉快速接入与 AI 智能意图提炼</text>
  <rect x="35" y="130" width="930" height="35" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
  <text x="45" y="152" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">“我们在支付购买企业版时，微信支付扣款了 999 元，但是系统提示订单失败，请尽快退款或补发会员！”</text>
  <rect x="635" y="173" width="175" height="24" fill="#f59e0b" rx="4"/>
  <text x="647" y="189" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">⚡ 模拟超时失败(测试重试)</text>
  <rect x="820" y="173" width="145" height="24" fill="#2563eb" rx="4"/>
  <text x="830" y="189" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">🚀 一键 AI 分析并生成草稿</text>

  <!-- Left: Ticket List -->
  <rect x="20" y="220" width="340" height="380" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <rect x="20" y="220" width="340" height="40" fill="#f1f5f9" rx="6"/>
  <text x="35" y="245" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">工单记录列表 (3)</text>

  <!-- Ticket Card 1 (Selected) -->
  <rect x="30" y="270" width="320" height="80" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="42" y="295" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">【账单纠纷】微信支付999元扣款失败...</text>
  <rect x="42" y="315" width="35" height="20" fill="#ffedd5" stroke="#fed7aa" rx="3"/>
  <text x="52" y="329" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#ea580c">P1</text>
  <rect x="85" y="315" width="55" height="20" fill="#e0f2fe" stroke="#bae6fd" rx="3"/>
  <text x="95" y="329" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" fill="#0284c7">待审核</text>
  <text x="290" y="329" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" fill="#94a3b8">13:25</text>

  <!-- Ticket Card 2 -->
  <rect x="30" y="360" width="320" height="80" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <text x="42" y="385" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#334155">【安全告警】客户密码被重置怀疑盗号</text>
  <rect x="42" y="405" width="35" height="20" fill="#fee2e2" stroke="#fecaca" rx="3"/>
  <text x="52" y="419" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">P0</text>
  <rect x="85" y="405" width="55" height="20" fill="#dcfce7" stroke="#bbf7d0" rx="3"/>
  <text x="95" y="419" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" fill="#16a34a">已归档</text>
  <text x="290" y="419" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" fill="#94a3b8">12:10</text>

  <!-- Right: Ticket Inspector Panel -->
  <rect x="375" y="220" width="605" height="380" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <text x="395" y="250" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#475569">工单标题</text>
  <rect x="395" y="260" width="565" height="30" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
  <text x="405" y="280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#1e293b">【账单纠纷】我们在支付购买企业版时，微信支付扣款了 999 元</text>

  <!-- Category & Priority Row -->
  <text x="395" y="310" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#475569">业务分类: 账单纠纷 (billing)</text>
  <text x="585" y="310" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#475569">紧急程度: P1 (核心故障)</text>
  <text x="775" y="310" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#475569">用户情绪: 😡 负面急切</text>

  <!-- Summary Box -->
  <text x="395" y="338" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#475569">AI 提取的问题核心摘要:</text>
  <rect x="395" y="348" width="565" height="45" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
  <text x="405" y="366" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#334155">1. 核心诉求：客户微信支付999元但订单失败；2. 业务判断：账单类纠纷，判定紧急度P1；</text>
  <text x="405" y="383" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#334155">3. 情绪评估：负向/情绪急切，需优先安抚并快速退款核验。</text>

  <!-- Suggested Reply Box -->
  <text x="395" y="415" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#475569">AI 拟定回复建议 (客服可在此直接微调润色):</text>
  <rect x="395" y="425" width="565" height="100" fill="#ffffff" stroke="#3b82f6" rx="4"/>
  <text x="405" y="445" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#1e293b">尊敬的用户您好，非常抱歉给您带来财务账单方面的不便！</text>
  <text x="405" y="465" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#1e293b">我们已针对您反馈的问题发起专员账单复核。请您放心，若核实存在重复扣款或计费异常，款项将在</text>
  <text x="405" y="485" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#1e293b">1-3 个工作日内原路退回至您的支付账户。如需加急处理，您可以回复提供订单流水截图，竭诚为您服务！</text>

  <!-- Action Buttons -->
  <rect x="395" y="545" width="65" height="32" fill="#ef4444" rx="4"/>
  <text x="408" y="566" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">🗑️ 删除</text>

  <rect x="470" y="545" width="120" height="32" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
  <text x="480" y="566" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#334155">💬 引用至聊天对话</text>

  <rect x="780" y="545" width="180" height="32" fill="#10b981" rx="4"/>
  <text x="795" y="566" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">✅ 确认并归档保存 (持久化)</text>
</svg>

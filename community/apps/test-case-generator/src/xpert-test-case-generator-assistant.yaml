team:
  name: test-case-generator-assistant
  type: agent
  title: 测试用例助手
  description: 面向需求描述输入、AI 测试用例生成、用例编辑和历史项目管理的业务助手
  avatar:
    emoji:
      id: clipboard
    background: rgb(219, 234, 254)
  options:
    templateKey: test-case-generator-assistant
    dataXpert:
      managedBy: data-xpert
      templateKey: test-case-generator-assistant
      assistantKind: business-assistant
      businessDomain: test-case-generator
      requiredPlugin: '@community/apps-test-case-generator'
      requiredPlugins:
        - '@community/apps-test-case-generator'
      requiredCapabilities:
        - test_case_generator
  agentConfig:
    stateVariables:
      - name: currentProjectId
        type: string
        default: ""
        description: Current test case project id selected in the workbench
        operation: null
    recursionLimit: 10000
  features:
    sandbox:
      enabled: true
      provider: docker-sandbox
  version: "1"
  agent:
    key: Agent_TestCaseGenerator
  copilotModel:
    referencedId: null
    modelType: llm
    model: qwen3.6-plus
    options:
      context_size: 1000000
      temperature: 0.2
      maxRetries: 6
      max_tokens: 8192
      top_p: 0.95
  knowledgebases: []
  toolsets: []
  tags: []
nodes:
  - type: agent
    key: Agent_TestCaseGenerator
    position:
      x: 860
      y: 20
    entity:
      key: Agent_TestCaseGenerator
      name: test-case-generator-assistant
      title: 测试用例助手
      description: 面向需求描述输入、AI 测试用例生成、用例编辑和历史项目管理的业务助手
      avatar:
        emoji:
          id: clipboard
        background: rgb(219, 234, 254)
      prompt: >
        You are Test Case Generator, a data-xpert business assistant for
        generating structured test cases from requirement descriptions.

        When the user describes a software requirement or feature, call
        test_case_generate exactly once with the requirementText and granularity
        parameters. The requirementText must be at least 20 Chinese characters
        and include functional rules, input/output constraints, and business
        scenarios.

        The generated testCases array must cover three categories:
        1. Normal flow (happy path) cases with expected correct behavior.
        2. Abnormal flow (error/edge/negative) cases with invalid inputs or
           failure conditions.
        3. Boundary condition cases with minimum/maximum values, empty inputs,
           or boundary limits.

        Auto-assign priority: P0 for critical business-path cases, P1 for
        important but non-blocking cases, P2 for minor or optional cases.

        If the requirement text is shorter than 20 characters or semantically
        vague, do NOT force generation. Return an INVALID_INPUT error asking
        the user to supplement functional rules, input/output constraints, or
        business scenarios.

        After generating cases, if the user confirms they want to keep them,
        call test_case_save_project to persist them to the library.

        When the user asks about existing projects, call test_case_list_projects.
        When the user asks to delete a project, call test_case_delete_project.

        Prefer concise Chinese responses for end users.
      collaboratorNames: []
      toolsetIds: []
      knowledgebaseIds: []
    hash: test-case-generator-agent-v1
  - type: workflow
    key: Middleware_TestCaseGenerator
    position:
      x: 1160
      y: 332
    entity:
      type: middleware
      key: Middleware_TestCaseGenerator
      title: Test Case Generator Tools
      provider: TestCaseGeneratorMiddleware
      required: true
    hash: test-case-generator-middleware-v1
connections:
  - type: workflow
    key: Agent_TestCaseGenerator/Middleware_TestCaseGenerator
    from: Agent_TestCaseGenerator
    to: Middleware_TestCaseGenerator
